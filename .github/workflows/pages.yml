name: Deploy Fun Lab to GitHub Pages
on:
  push:
    branches: ["claude/fervent-cray-xjrm74", "main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Enabling Pages needs a repo admin (one click: Settings -> Pages -> Source: "GitHub Actions").
      # Until then, skip cleanly with a notice instead of failing every push.
      - id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Pages not enabled::Enable it once: Settings -> Pages -> Build and deployment -> Source: GitHub Actions. Then re-run this workflow."
          fi
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - name: Assemble site
        if: steps.pages.outputs.enabled == 'true'
        run: |
          mkdir -p _site/lab
          cp -r index.html games assets research DECISIONS.md REPORT.md _site/
          cp -r lab/notes _site/lab/
          cp lab/results/summary.v1.json lab/results/summary.v2.json _site/lab/
          rm -f _site/games/_example.html
          touch _site/.nojekyll
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
