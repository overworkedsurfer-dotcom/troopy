name: Deploy Fun Lab to GitHub Pages
on:
  push:
    branches: ["claude/fervent-cray-xjrm74", "main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html games assets research DECISIONS.md REPORT.md _site/
          mkdir -p _site/lab && cp -r lab/notes _site/lab/ && cp lab/results/summary.v1.json lab/results/summary.v2.json _site/lab/ 2>/dev/null || true
          rm -f _site/games/_example.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
