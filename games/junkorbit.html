<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Junk Orbit</title>
<meta name="description" content="Slingshot comets around gravity wells to pop stars. Every comet you fire stays in orbit forever, and loose junk comes back for your launcher.">
<style>
  html,body{margin:0;height:100%;background:#05040f;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block;margin:0 auto}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';
const ID = 'junkorbit';
const W = 540, H = 780;                       // logical resolution
const STEP = 1000 / 60, SUB = 3, DT = 1 / 60 / SUB;
const CX = 270, CY = 392, RA = 262, RL = 206, LX = CX, LY = CY + RL;   // system centre, rim, launcher
const TS = 1.25, KREF = 6e5 * TS * TS;   // force ~ k / r^1.5 (spirograph rosettes); planets are soft-cored gas giants
const HALO = 2.7, DRAG = 5 * TS, CAP_PX = 52, SAFE_PX = 14, LAUNCH_F = 0.45;
const AIM_MAX = 1.40, AIM_V0 = 0.9, AIM_VMAX = 1.9, AIM_RAMP = 350;
const COOL = 600, BUF = 260, LIVE = 3200, LHIT = 11, CHIT = 6, SHIT = 18, INV = 2200, SHOCK = 80;
const MAX_BODIES = 70, SAFE_MAX = 12, SAFE_FADE = 3000;
function e2of(p) { return 100 + 0.81 * p.r * p.r; }
const PCOL = [['#ffb48a', '#ff7a4d', '#7a2a1c'], ['#c5b8ff', '#8a74ff', '#2e2170'], ['#9ff5df', '#2fd6b0', '#0d5246']];
const cv = document.getElementById('c'), cx = cv.getContext('2d');

// ---------- seeded RNG (state lives in S.rng) ----------
function rnd() {
  let t = (S.rng = (S.rng + 0x6D2B79F5) | 0);
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

// ---------- best score ----------
function loadBest() { try { return +localStorage.getItem('funlab.' + ID + '.best') || 0; } catch (e) { return 0; } }
function saveBest(v) { try { localStorage.setItem('funlab.' + ID + '.best', String(v)); } catch (e) {} }
let best = loadBest();

// ---------- audio (lazy, fail-safe) ----------
let AC = null, MASTER = null, NOISE = null;
function audioInit() {
  try {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      MASTER = AC.createGain(); MASTER.gain.value = 0.55; MASTER.connect(AC.destination);
      const n = AC.sampleRate, b = AC.createBuffer(1, n, n), d = b.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
      NOISE = b;
    }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { AC = null; }
}
function tone(f, d, type, v, slide, delay) {
  if (QUIET || !AC) return;
  try {
    const t = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f * slide), t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v || 0.1, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(MASTER); o.start(t); o.stop(t + d + 0.03);
  } catch (e) {}
}
function noise(d, v, f0, f1, delay) {
  if (QUIET || !AC || !NOISE) return;
  try {
    const t = AC.currentTime + (delay || 0), s = AC.createBufferSource(), fl = AC.createBiquadFilter(), g = AC.createGain();
    s.buffer = NOISE; fl.type = 'lowpass'; fl.frequency.setValueAtTime(f0, t); fl.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    s.connect(fl); fl.connect(g); g.connect(MASTER); s.start(t, Math.random() * 0.5); s.stop(t + d + 0.03);
  } catch (e) {}
}
const SFX = {
  fire() { tone(620, 0.13, 'square', 0.045, 0.45); tone(1240, 0.06, 'triangle', 0.03); noise(0.08, 0.05, 4000, 800); },
  star(chain, passive) {
    const f = (passive ? 740 : 660) * Math.pow(2, Math.min(chain - 1, 6) * 4 / 12);
    tone(f, 0.2, 'triangle', passive ? 0.05 : 0.09); tone(f * 1.5, 0.26, 'sine', passive ? 0.03 : 0.06, null, 0.05);
    if (!passive && chain >= 2) tone(f * 2, 0.32, 'sine', 0.05, null, 0.1);
  },
  capture() { tone(392, 0.35, 'sine', 0.07); tone(587, 0.4, 'sine', 0.06, null, 0.08); tone(784, 0.5, 'sine', 0.045, null, 0.16); },
  save() { noise(0.22, 0.14, 3500, 300); tone(320, 0.16, 'square', 0.05, 0.5); tone(960, 0.2, 'triangle', 0.05, null, 0.06); },
  smash() { noise(0.18, 0.1, 1800, 200); tone(200, 0.15, 'square', 0.04, 0.6); },
  crash() { noise(0.3, 0.1, 1200, 90); tone(110, 0.28, 'sine', 0.1, 0.5); },
  hit() { noise(0.7, 0.3, 2400, 50); tone(190, 0.7, 'sawtooth', 0.12, 0.22); tone(95, 0.8, 'square', 0.06, 0.4); },
  burn() { tone(1300, 0.45, 'sawtooth', 0.035, 0.18); noise(0.4, 0.06, 6000, 400); },
  level() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.3, 'triangle', 0.07, null, i * 0.08)); noise(1.2, 0.06, 300, 3000); },
  warn() { tone(1560, 0.05, 'square', 0.025); },
  heart() { [784, 988, 1319].forEach((f, i) => tone(f, 0.25, 'sine', 0.07, null, i * 0.06)); },
  over() { tone(320, 1.3, 'sawtooth', 0.12, 0.12); noise(1.4, 0.25, 1500, 40); },
  tick() { tone(2100, 0.03, 'sine', 0.018); },
};

// ---------- state ----------
let S = null;            // ALL sim state
let FX = null;           // cosmetic only
let QUIET = false, manual = false, carry = 0, overAt = 0;
const held = { left: false, right: false };
let touchUI = false;

function slot(x, y, r, k) { return { x, y, r, k }; }
function newState(seed) {
  const s = {
    rng: (seed | 0) || 1, t: 0, score: 0, over: false, cause: null,
    level: 1, prog: 0, need: 6, diff: 0,
    planets: [slot(CX, CY, 26, KREF), slot(CX, CY, 0, 0), slot(CX, CY, 0, 0)], shift: null,
    aim: 0, aimHold: 0, cool: 0, buf: 0, fireQ: false, botRot: 0, touchAim: null,
    hearts: 3, inv: 0, freeze: 0,
    bodies: [], nextId: 1, fired: 0,
    stars: [], spawnT: 900, starId: 1,
    streak: 0,
    st: { captured: 0, saved: 0, missed: 0, burnt: 0, passive: 0, stars: 0, hitShots: 0, retired: 0 },
  };
  return s;
}
function newFX() { return { threat: null, slowmo: 0, slowDone: false, streakPop: 0, streakLost: 0, parts: [], texts: [], rings: [], trails: {}, shake: 0, flash: 0, flashCol: '255,255,255', hintA: 1, banner: null, recoil: 0, heartPop: [0, 0, 0], warnT: 0, warn: 0, tick: 0, lastAlign: 0 }; }

function reset(seed) {
  S = newState(seed); FX = newFX(); carry = 0;
  for (let i = 0; i < 3; i++) { spawnStar(); if (S.stars[i]) S.stars[i].born = -250 * i; }
}

// ---------- physics helpers (pure) ----------
function phi(pl, x, y) {
  let s = 0;
  for (let i = 0; i < pl.length; i++) { const p = pl[i]; if (p.k <= 0) continue; const dx = p.x - x, dy = p.y - y; s -= 2 * p.k / Math.sqrt(Math.sqrt(dx * dx + dy * dy + e2of(p))); }
  return s;
}
function launchSpeed(pl) { return Math.sqrt(LAUNCH_F * -phi(pl, LX, LY) / 2); }
// gravity at (x,y) into b.ax/b.ay; returns drag factor for this substep (1 = none)
function accel(b, pl, drag) {
  let ax = 0, ay = 0, dmul = 1;
  for (let i = 0; i < pl.length; i++) {
    const p = pl[i]; if (p.k <= 0) continue;
    const dx = p.x - b.x, dy = p.y - b.y, d2r = dx * dx + dy * dy, d2 = d2r + e2of(p), inv = p.k / (d2 * Math.sqrt(Math.sqrt(d2)));
    ax += dx * inv; ay += dy * inv;
    const h = p.r * HALO;
    if (d2r < h * h) {
      if (b.live) b.sling = true;
      if (drag) { const d = Math.sqrt(d2r), depth = Math.min(1, (h - d) / (h - p.r)); dmul -= DRAG * depth * depth * DT; }
    }
  }
  b.ax = ax; b.ay = ay;
  return dmul;
}
// advance one body by one leapfrog (kick-drift-kick) substep; planets are passable, their soft core brakes hardest
function sub(b, pl, drag) {
  b.vx += b.ax * DT / 2; b.vy += b.ay * DT / 2;
  b.x += b.vx * DT; b.y += b.vy * DT;
  const dm = accel(b, pl, drag);
  b.vx += b.ax * DT / 2; b.vy += b.ay * DT / 2;
  if (dm < 1) { b.vx *= Math.max(0, dm); b.vy *= Math.max(0, dm); }
}
// energy thresholds: E < safeE  => the launcher's hitbox is out of reach (static field); capture lands well below it
function thresholds(pl) {
  const t = { x: LX, y: LY, live: false, ax: 0, ay: 0 }; accel(t, pl, false);
  const g = Math.hypot(t.ax, t.ay), p0 = phi(pl, LX, LY);
  return { safe: p0 - SAFE_PX * g, cap: p0 - CAP_PX * g };
}
// the system rim reflects: nothing ever leaves
function rim(b) {
  const rx = b.x - CX, ry = b.y - CY, r2 = rx * rx + ry * ry;
  if (r2 <= RA * RA) return false;
  const r = Math.sqrt(r2), nx = rx / r, ny = ry / r, vr = b.vx * nx + b.vy * ny;
  b.x = CX + nx * RA; b.y = CY + ny * RA;
  if (vr > 0) { b.vx -= 2 * vr * nx; b.vy -= 2 * vr * ny; return true; }
  return false;
}

// ---------- levels ----------
function layout(level) {
  const pl = [slot(CX, CY, 0, 0), slot(CX, CY, 0, 0), slot(CX, CY, 0, 0)];
  const ref = phi([slot(CX, CY, 26, KREF)], LX, LY);
  for (let tries = 0; tries < 40; tries++) {
    let ps;
    if (level === 2) {
      const bx = CX + (rnd() - 0.5) * 100, by = CY - 10 + (rnd() - 0.5) * 70, a = rnd() * 6.283, d = 125 + rnd() * 30;
      ps = [slot(bx, by, 26, KREF), slot(bx + Math.cos(a) * d, by + Math.sin(a) * d, 12, KREF * 0.2)];
    } else {
      const n = level >= 5 ? 3 : 2, radii = n === 3 ? [22, 17, 13] : [24, 17];
      ps = [];
      for (let i = 0; i < n; i++) { const a = rnd() * 6.283, d = rnd() * 125; ps.push(slot(CX + Math.cos(a) * d, CY - 15 + Math.sin(a) * d * 0.9, radii[i], KREF * (radii[i] / 26) * (radii[i] / 26))); }
    }
    let ok = true;
    for (let i = 0; i < ps.length && ok; i++) {
      const p = ps[i];
      if (Math.hypot(p.x - LX, p.y - LY) < 112 || Math.hypot(p.x - CX, p.y - CY) > RA - 70) ok = false;
      for (let j = 0; j < i && ok; j++) if (Math.hypot(p.x - ps[j].x, p.y - ps[j].y) < (ps.length === 3 ? 112 : 135)) ok = false;
    }
    if (!ok) continue;
    const sc = ref / phi(ps, LX, LY);
    for (let i = 0; i < ps.length; i++) { ps[i].k *= sc; pl[i] = ps[i]; }
    return pl;
  }
  pl[0] = slot(CX, CY, 26, KREF); return pl;
}
function startShift() {
  const to = layout(S.level), from = S.planets.map(p => ({ x: p.x, y: p.y, r: p.r, k: p.k }));
  for (let i = 0; i < 3; i++) {
    if (from[i].r <= 0) { from[i].x = to[i].x; from[i].y = to[i].y; }
    if (to[i].r <= 0) { to[i].x = from[i].x; to[i].y = from[i].y; }
  }
  S.shift = { e: 0, dur: 2200, from, to };
  S.inv = Math.max(S.inv, 2300);
}
function easeIO(u) { return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; }

// ---------- stars ----------
function fuseFor() { return Math.max(2500, 15000 * Math.pow(0.9, S.diff)); }
function spawnEvery() { return Math.max(300, 3300 * Math.pow(0.85, S.diff)); }
function maxStars() { return Math.min(12, 3 + Math.floor(S.diff / 1.5)); }
function spawnStar() {
  const v0 = launchSpeed(S.planets), E0 = phi(S.planets, LX, LY) + v0 * v0 / 2;
  for (let tries = 0; tries < 30; tries++) {
    const a = rnd() * 6.283, r = 45 + rnd() * 172, x = CX + Math.cos(a) * r, y = CY + Math.sin(a) * r * 0.96;
    if (Math.hypot(x - LX, y - LY) < 72) continue;
    let ok = true;
    for (const p of S.planets) if (p.r > 0 && Math.hypot(x - p.x, y - p.y) < p.r * HALO + 10) ok = false;
    for (const s of S.stars) if (Math.hypot(x - s.x, y - s.y) < 46) ok = false;
    if (!ok || phi(S.planets, x, y) > E0 - 400) continue;
    const f = fuseFor(), drift = S.level >= 4;
    S.stars.push({ id: S.starId++, x, y, ax: x, ay: y, fuse: f, fuse0: f, dr: drift ? 12 + rnd() * 26 : 0, w: drift ? (0.5 + rnd() * 0.7) * (rnd() < 0.5 ? -1 : 1) : 0, ph: rnd() * 6.283, born: S.t });
    return true;
  }
  return false;
}

// ---------- FX helpers (never touch S) ----------
function burst(x, y, n, col, spd, life) {
  if (QUIET) return;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, s = (0.3 + Math.random()) * (spd || 3);
    FX.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, dec: 0.012 + Math.random() * 0.02 / (life || 1), col, sz: 1.5 + Math.random() * 2.5 });
  }
}
function floatText(x, y, txt, col, size) {
  if (QUIET) return;
  for (let k = 0; k < 5; k++) { let hit = false; for (const t of FX.texts) if (t.life > 0.55 && Math.abs(t.x - x) < 90 && Math.abs(t.y - y) < 19) { hit = true; break; } if (!hit) break; y -= 21; }
  FX.texts.push({ x, y, txt, col, life: 1, size: size || 20 });
}
function ring(x, y, col, r0, r1, w) { if (!QUIET) FX.rings.push({ x, y, col, r0, r1, w: w || 3, life: 1 }); }
function shake(a) { if (!QUIET) FX.shake = Math.max(FX.shake, a); }
function flash(a, col) { if (!QUIET) { FX.flash = Math.max(FX.flash, a); FX.flashCol = col || '255,255,255'; } }
function banner(txt, sub, col) { if (!QUIET) FX.banner = { txt, sub, col, life: 1 }; }
function mult() { return 1 + 0.5 * S.streak; }
function fmtT(ms) { const s = Math.max(0, Math.round(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }

// ---------- simulation ----------
function stepFX() {
  for (const p of FX.parts) { p.x += p.vx; p.y += p.vy; p.vx *= 0.97; p.vy *= 0.97; p.life -= p.dec; }
  FX.parts = FX.parts.filter(p => p.life > 0);
  if (FX.parts.length > 900) FX.parts.splice(0, FX.parts.length - 900);
  for (const t of FX.texts) { t.y -= 0.55 * Math.max(0.2, t.life); t.life -= 0.014; }
  FX.texts = FX.texts.filter(t => t.life > 0);
  for (const r of FX.rings) r.life -= 0.03;
  FX.rings = FX.rings.filter(r => r.life > 0);
  FX.shake *= 0.86; FX.flash *= 0.88; FX.recoil *= 0.82;
  for (let i = 0; i < 3; i++) FX.heartPop[i] *= 0.93;
  FX.streakPop *= 0.9; FX.streakLost *= 0.95;
  if (FX.banner) { FX.banner.life -= 0.007; if (FX.banner.life <= 0) FX.banner = null; }
  FX.tick++;
}
function recordTrails() {
  if ((FX.tick & 1) === 0) {
    for (const b of S.bodies) {
      let tr = FX.trails[b.id]; if (!tr) tr = FX.trails[b.id] = [];
      tr.push(b.x, b.y);
      const max = b.live ? 70 : b.cap ? (S.t - b.capT > SAFE_FADE ? 36 : 120) : 130;
      if (tr.length > max) tr.splice(0, tr.length - max);
    }
  }
  if (FX.tick % 30 === 0) {
    const alive = {}; for (const b of S.bodies) alive[b.id] = 1;
    for (const k in FX.trails) if (!alive[k]) delete FX.trails[k];
  }
}

function step() {
  if (!QUIET) stepFX();
  if (S.over) return;
  if (S.freeze > 0) { S.freeze -= STEP; return; }   // hitstop (deterministic)
  S.t += STEP;
  S.diff = 0.7 * (S.level - 1) + S.t / 30000;
  if (S.inv > 0) S.inv -= STEP;

  // planet shift between levels
  if (S.shift) {
    const sh = S.shift; sh.e += STEP; const u = easeIO(Math.min(1, sh.e / sh.dur));
    for (let i = 0; i < 3; i++) { const a = sh.from[i], b = sh.to[i], p = S.planets[i]; p.x = a.x + (b.x - a.x) * u; p.y = a.y + (b.y - a.y) * u; p.r = a.r + (b.r - a.r) * u; p.k = a.k + (b.k - a.k) * u; }
    if (sh.e >= sh.dur) {
      S.shift = null;
      for (const st of S.stars) for (const p of S.planets) if (p.r > 0 && Math.hypot(st.x - p.x, st.y - p.y) < p.r * HALO) { st.dead = true; burst(st.x, st.y, 10, '#ffd84a', 2); }
    }
  }

  // aim
  const hr = (held.right ? 1 : 0) - (held.left ? 1 : 0);
  const rot = S.botRot || hr;
  if (rot) {
    S.touchAim = null;
    S.aimHold += STEP;
    S.aim = Math.max(-AIM_MAX, Math.min(AIM_MAX, S.aim + rot * (S.aimHold <= AIM_RAMP ? AIM_V0 : AIM_VMAX) / 60));
  } else {
    S.aimHold = 0;
    if (S.touchAim != null) { const d = S.touchAim - S.aim; S.aim += Math.max(-0.12, Math.min(0.12, d)); }
  }

  // fire (with input buffer)
  if (S.cool > 0) S.cool -= STEP;
  if (S.fireQ) { S.fireQ = false; S.buf = BUF; }
  if (S.buf > 0) { if (S.cool <= 0) { fire(); S.buf = 0; } else S.buf -= STEP; }

  // physics
  const pl = S.planets, TH = thresholds(pl);
  for (const b of S.bodies) {
    const dr = b.live && !b.braked;            // only comets in flight are braked by planet glow
    for (let k = 0; k < SUB; k++) sub(b, pl, dr);
    if (rim(b)) { ring(b.x, b.y, '#8a74ff', 2, 16, 2); if (b.live && !QUIET) tone(240, 0.06, 'sine', 0.025); }
  }
  for (const b of S.bodies) {
    if (b.dead) continue;
    const ph = phi(pl, b.x, b.y), E = (b.vx * b.vx + b.vy * b.vy) / 2 + ph;
    if (b.live) {
      if (!b.braked && E < TH.cap) { setEnergy(b, TH.cap - 400, 'up'); b.braked = true; }
      if (S.t - b.born > LIVE) settle(b, TH);
    } else if (b.cap && E > TH.cap) setEnergy(b, TH.cap - 400, 'down');   // safe stays safe, even when the planets shift
  }
  // collisions: live comets vs loose junk / wrecks (captured junk rides its own orbit lane)
  for (const a of S.bodies) {
    if (a.dead || !a.live) continue;
    for (const b of S.bodies) {
      if (b === a || b.dead || !b.loose) continue;
      const dx = a.x - b.x, dy = a.y - b.y;
      if (dx * dx + dy * dy < CHIT * CHIT) { collide(a, b); break; }
    }
  }
  // stars
  for (const st of S.stars) {
    if (st.dr > 0) { st.ph += st.w / 60; st.x = st.ax + Math.cos(st.ph) * st.dr; st.y = st.ay + Math.sin(st.ph) * st.dr; }
    for (const b of S.bodies) {
      if (b.dead || st.dead || b.loose) continue;     // loose debris doesn't score
      const dx = b.x - st.x, dy = b.y - st.y;
      if (dx * dx + dy * dy < SHIT * SHIT) starHit(st, b);
    }
    if (!st.dead) { st.fuse -= STEP; if (st.fuse <= 0) burnout(st); }
  }
  S.stars = S.stars.filter(s => !s.dead);
  // launcher
  for (const b of S.bodies) {
    if (b.dead || !b.loose) continue;               // only loose debris can hurt you
    const dx = b.x - LX, dy = b.y - LY;
    if (dx * dx + dy * dy < LHIT * LHIT) { launcherHit(b); if (S.over) break; }
  }
  S.bodies = S.bodies.filter(b => !b.dead);
  if (S.over) return;
  // hard body cap (performance): the oldest loose debris fizzles
  if (S.bodies.length > MAX_BODIES) {
    let oi = -1;
    for (let i = 0; i < S.bodies.length; i++) if (S.bodies[i].loose) { oi = i; break; }
    if (oi < 0) oi = 0;
    const b = S.bodies[oi]; burst(b.x, b.y, 8, '#ff9f43', 1.5); floatText(b.x, b.y, 'fizzled', '#ffae5e', 13);
    S.bodies.splice(oi, 1);
  }
  // spawning
  S.spawnT -= STEP;
  if (S.spawnT <= 0) { S.spawnT = spawnEvery(); if (S.stars.length < maxStars()) spawnStar(); }
  // level up
  if (S.prog >= S.need && !S.shift) {
    S.prog = 0; S.level++; S.need = 4 + 2 * S.level;
    const bonus = 250 * (S.level - 1); S.score += bonus;
    startShift();

  for (const b of S.bodies) {
    if (b.live) {
      const g = cx.createRadialGradient(b.x, b.y, 0, b.x, b.y, 14); g.addColorStop(0, 'rgba(220,255,255,0.9)'); g.addColorStop(1, 'rgba(125,249,255,0)');
      cx.fillStyle = g; cx.beginPath(); cx.arc(b.x, b.y, 14, 0, 6.283); cx.fill();
      cx.fillStyle = '#fff'; cx.beginPath(); cx.arc(b.x, b.y, 4, 0, 6.283); cx.fill();
      if (b.sling) { cx.strokeStyle = 'rgba(255,216,74,0.8)'; cx.lineWidth = 1.5; cx.beginPath(); cx.arc(b.x, b.y, 8 + pulse * 2, 0, 6.283); cx.stroke(); }
    } else if (b.cap) {
      const f = Math.max(0, 1 - (S.t - b.capT) / SAFE_FADE);
      cx.globalAlpha = 0.45 + 0.4 * f; cx.fillStyle = '#9fb2ff'; cx.beginPath(); cx.arc(b.x, b.y, 2.4 + 1.5 * f, 0, 6.283); cx.fill(); cx.globalAlpha = 1;
    } else {
      const ht = hotness(b), col = b.kind === 'w' ? '#ff5a3a' : '#ff9f43';
      const gr = 9 + ht * 8 + pulse * 3, g = cx.createRadialGradient(b.x, b.y, 0, b.x, b.y, gr);
      g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
      cx.fillStyle = g; cx.globalAlpha = 0.85 + 0.15 * ht; cx.beginPath(); cx.arc(b.x, b.y, gr, 0, 6.283); cx.fill(); cx.globalAlpha = 1;
      cx.fillStyle = '#ffe0b8';
      if (b.kind === 'w') { cx.save(); cx.translate(b.x, b.y); cx.rotate(now / 300 + b.id); cx.fillStyle = '#ffb08a'; cx.fillRect(-3.5, -3.5, 7, 7); cx.restore(); }
      else { cx.beginPath(); cx.arc(b.x, b.y, b.cap ? 2.6 : 3.2, 0, 6.283); cx.fill(); }
    }
  }
  cx.globalCompositeOperation = 'source-over';
  // loose debris: labelled; the NEXT one to reach the launcher gets a red ring, a line home and a countdown
  cx.textAlign = 'center';
  for (const b of S.bodies) {
    if (!b.loose) continue;
    const thr = FX.threat && FX.threat.id === b.id && !S.over;
    cx.font = font(thr ? 15 : 12); cx.fillStyle = thr ? '#ffd0d8' : 'rgba(255,190,140,0.85)';
    cx.fillText((b.kind === 'w' ? 'wreck' : '#' + b.n) + (thr ? ' INCOMING' : ''), b.x, b.y - (thr ? 22 : 11));
    if (thr) {
      cx.strokeStyle = 'rgba(255,70,100,' + (0.6 + 0.4 * pulse) + ')'; cx.lineWidth = 3; cx.beginPath(); cx.arc(b.x, b.y, 13 + 3 * pulse, 0, 6.283); cx.stroke();
      cx.globalAlpha = 0.55 + 0.45 * FX.warn; cx.strokeStyle = '#ff5e7e'; cx.lineWidth = 2; cx.setLineDash([6, 6]); cx.lineDashOffset = -now / 30;
      cx.beginPath(); cx.moveTo(b.x, b.y); cx.lineTo(LX, LY); cx.stroke(); cx.setLineDash([]); cx.globalAlpha = 1;
    }
  }

  // launcher
  {
    const inv = S.inv > 0 && !S.over, a = S.aim, rc = FX.recoil * 6;
    if (FX.threat && FX.threat.t < 1500 && FX.threat.t > 0 && !S.over) {
      const f = FX.threat.t / 1500;
      cx.strokeStyle = 'rgba(255,60,90,0.25)'; cx.lineWidth = 6; cx.beginPath(); cx.arc(LX, LY, 30, 0, 6.283); cx.stroke();
      cx.strokeStyle = 'rgba(255,60,90,' + (0.75 + 0.25 * pulse) + ')'; cx.beginPath(); cx.arc(LX, LY, 30, -Math.PI / 2, -Math.PI / 2 + 6.283 * f); cx.stroke();
      cx.font = font(14); cx.fillStyle = '#ff9fb0'; cx.textAlign = 'center'; cx.fillText((FX.threat.t / 1000).toFixed(1) + 's', LX + 50, LY + 5);
    }
    if (inv) { cx.strokeStyle = 'rgba(125,249,255,' + (0.35 + 0.35 * pulse) + ')'; cx.lineWidth = 2.5; cx.beginPath(); cx.arc(LX, LY, 24, 0, 6.283); cx.stroke(); }
    cx.save(); cx.translate(LX, LY); cx.rotate(a);
    cx.fillStyle = '#3b3f7a'; cx.fillRect(-4.5, -26 + rc, 9, 20);
    cx.fillStyle = S.cool <= 0 ? '#ffd84a' : '#8b8fbf'; cx.fillRect(-4.5, -29 + rc, 9, 5);
    cx.restore();
    if (!S.over) {
      const g = cx.createRadialGradient(LX - 4, LY - 5, 2, LX, LY, 17); g.addColorStop(0, '#ffffff'); g.addColorStop(0.6, '#c9ccff'); g.addColorStop(1, '#5a5fa8');
      cx.fillStyle = g; cx.beginPath(); cx.arc(LX, LY, 15, 0, 6.283); cx.fill();
      cx.strokeStyle = '#ffd84a'; cx.lineWidth = 3; cx.beginPath(); cx.arc(LX, LY, 15, -Math.PI / 2, -Math.PI / 2 + 6.283 * (1 - Math.max(0, S.cool) / COOL)); cx.stroke();
    }
  }

  // FX
  cx.globalCompositeOperation = 'lighter';
  for (const p of FX.parts) { cx.globalAlpha = Math.max(0, p.life); cx.fillStyle = p.col; cx.fillRect(p.x - p.sz / 2, p.y - p.sz / 2, p.sz, p.sz); }
  cx.globalCompositeOperation = 'source-over';
  for (const r of FX.rings) { const u = 1 - r.life, e = 1 - Math.pow(1 - u, 3); cx.globalAlpha = r.life; cx.strokeStyle = r.col; cx.lineWidth = r.w * r.life + 0.5; cx.beginPath(); cx.arc(r.x, r.y, Math.max(0.5, r.r0 + (r.r1 - r.r0) * e), 0, 6.283); cx.stroke(); }
  cx.globalAlpha = 1; cx.textAlign = 'center';
  if (!S.over) for (const t of FX.texts) {
    const u = (1 - t.life) / 0.12, s = u < 1 ? 0.4 + 0.6 * (1 + 2.7 * Math.pow(u - 1, 3) + 1.7 * Math.pow(u - 1, 2)) : 1;
    cx.globalAlpha = Math.min(1, t.life * 2.2); cx.font = font(Math.round(t.size * s));
    cx.lineWidth = 4; cx.strokeStyle = 'rgba(5,4,15,0.85)'; cx.strokeText(t.txt, t.x, t.y); cx.fillStyle = t.col; cx.fillText(t.txt, t.x, t.y);
  }
  cx.globalAlpha = 1;
  cx.restore();
  if (FX.flash > 0.02) { cx.fillStyle = 'rgba(' + FX.flashCol + ',' + (FX.flash * 0.5) + ')'; cx.fillRect(0, 0, W, H); }

  drawHUD(now, pulse);
}

function drawHUD(now, pulse) {
  // top bar
  const g = cx.createLinearGradient(0, 0, 0, 112); g.addColorStop(0, 'rgba(5,4,15,0.85)'); g.addColorStop(1, 'rgba(5,4,15,0)');
  cx.fillStyle = g; cx.fillRect(0, 0, W, 112);
  cx.textAlign = 'left'; cx.fillStyle = '#f4f1ff'; cx.font = font(30); cx.fillText(String(S.score), 16, 40);
  cx.font = font(14); cx.fillStyle = '#9a98c8'; cx.fillText('SCORE', 18, 58);
  cx.textAlign = 'right'; cx.font = font(24); cx.fillStyle = '#ffd84a'; cx.fillText(String(Math.max(best, S.score)), W - 16, 36);
  cx.font = font(14); cx.fillStyle = '#9a98c8'; cx.fillText('BEST', W - 16, 54);
  // hearts (centre)
  for (let i = 0; i < 3; i++) {
    const x = W / 2 - 34 + i * 34, y = 16, pop = FX.heartPop[i], s = 22 * (1 + pop * 0.6);
    heartPath(x, y - pop * 4, s);
    if (i < S.hearts) { cx.fillStyle = '#ff5e7e'; cx.fill(); } else { cx.strokeStyle = 'rgba(255,94,126,' + (0.35 + pop * 0.6) + ')'; cx.lineWidth = 2; cx.stroke(); }
  }
  // streak + level row
  {
    const sp = FX.streakPop, sl = FX.streakLost, jx = sl > 0.3 ? (Math.random() - 0.5) * 6 * sl : 0;
    cx.save(); cx.translate(16 + jx, 88); cx.scale(1 + sp * 0.35, 1 + sp * 0.35);
    cx.textAlign = 'left'; cx.font = font(19);
    cx.fillStyle = sl > 0.2 ? 'rgba(255,94,126,' + (0.4 + sl * 0.6) + ')' : S.streak ? '#7df9ff' : '#6f6d9a';
    cx.fillText('×' + mult().toFixed(1) + (sl > 0.2 ? ' STREAK LOST' : ' STREAK'), 0, 0); cx.restore();
    for (let i = 0; i < 8; i++) { cx.fillStyle = i < S.streak ? '#7df9ff' : 'rgba(125,249,255,0.15)'; cx.fillRect(16 + i * 16, 96, 12, 5); }
  }
  cx.textAlign = 'center'; cx.font = font(18); cx.fillStyle = '#ffd84a'; cx.fillText('LEVEL ' + S.level, W / 2, 72);
  cx.fillStyle = 'rgba(255,216,74,0.18)'; cx.fillRect(W / 2 - 70, 80, 140, 6);
  cx.fillStyle = '#ffd84a'; cx.fillRect(W / 2 - 70, 80, 140 * Math.min(1, S.prog / S.need), 6);
  let cap = 0, loose = 0; for (const b of S.bodies) { if (b.cap) cap++; else if (b.loose) loose++; }
  cx.textAlign = 'right'; cx.font = font(17);
  cx.fillStyle = '#a9b8ff'; cx.fillText('SAFE ' + cap + '/' + SAFE_MAX, W - 16, 82);
  cx.fillStyle = loose ? 'rgba(255,174,94,' + (0.75 + 0.25 * pulse) + ')' : '#6f6d9a'; cx.fillText('LOOSE ' + loose + (loose ? ' ⚠' : ''), W - 16, 102);

  // bottom: legend + hint
  cx.textAlign = 'center';
  cx.font = font(15, 'normal');
  cx.fillStyle = '#8fa6ff'; cx.fillText('● hit a star → SAFE orbit (scores for you, max ' + SAFE_MAX + ')', W / 2, 676);
  cx.fillStyle = '#ffae5e'; cx.fillText('● miss → LOOSE debris that hunts you · shoot it to SAVE', W / 2, 697);
  if (FX.hintA > 0.01 && !S.over) {
    cx.globalAlpha = Math.min(1, FX.hintA);
    cx.font = font(20); cx.fillStyle = '#f4f1ff';
    cx.fillText(touchUI ? 'drag to aim · release to fire' : '← → aim · SPACE fire  (or mouse)', W / 2, 730);
    cx.font = font(16, 'normal'); cx.fillStyle = '#ffc9a0';
    cx.fillText('every miss is debris that hunts you', W / 2, 756);
    cx.globalAlpha = 1;
  }
  if (FX.banner) {
    const b = FX.banner, u = 1 - b.life, e = u < 0.15 ? 1 - Math.pow(1 - u / 0.15, 3) : 1, a = Math.min(1, b.life * 4);
    cx.globalAlpha = a; cx.textAlign = 'center'; cx.font = font(Math.round(44 * (0.6 + 0.4 * e)));
    cx.lineWidth = 6; cx.strokeStyle = 'rgba(5,4,15,0.85)'; cx.strokeText(b.txt, W / 2, 210); cx.fillStyle = b.col; cx.fillText(b.txt, W / 2, 210);
    cx.font = font(18); cx.strokeText(b.sub, W / 2, 240); cx.fillStyle = '#f4f1ff'; cx.fillText(b.sub, W / 2, 240); cx.globalAlpha = 1;
  }
  if (S.over) {
    cx.fillStyle = 'rgba(5,4,15,0.6)'; cx.fillRect(0, 0, W, H);
    cx.fillStyle = 'rgba(16,12,44,0.94)'; cx.strokeStyle = 'rgba(255,94,126,0.6)'; cx.lineWidth = 2;
    cx.beginPath(); if (cx.roundRect) cx.roundRect(36, 205, W - 72, 375, 18); else cx.rect(36, 205, W - 72, 375); cx.fill(); cx.stroke();
    cx.textAlign = 'center'; cx.fillStyle = '#ff5e7e'; cx.font = font(50); cx.fillText('GAME OVER', W / 2, 270);
    cx.font = font(19); cx.fillStyle = '#ffd2db';
    const cs = S.cause || '', ci = cs.indexOf(' (');
    (ci > 0 ? [cs.slice(0, ci), cs.slice(ci + 1)] : wrap(cs, 34)).forEach((ln, i) => cx.fillText(ln, W / 2, 312 + i * 26));
    cx.fillStyle = '#f4f1ff'; cx.font = font(36); cx.fillText(String(S.score), W / 2, 395);
    cx.font = font(16); cx.fillStyle = '#9a98c8'; cx.fillText('SCORE', W / 2, 416);
    cx.font = font(20); cx.fillStyle = '#ffd84a'; cx.fillText((FX.newBest ? 'NEW BEST! ' : 'BEST ') + best, W / 2, 452);
    cx.font = font(16, 'normal'); cx.fillStyle = '#b7b3e6';
    cx.fillText('level ' + S.level + ' · ' + S.st.hitShots + '/' + S.fired + ' comets hit a star · ' + S.st.saved + ' loose shot down', W / 2, 486);
    const ok = performance.now() - overAt > 400;
    cx.globalAlpha = ok ? 0.6 + 0.4 * pulse : 0.3; cx.font = font(20); cx.fillStyle = '#f4f1ff';
    cx.fillText('press any key or tap to retry', W / 2, 540); cx.globalAlpha = 1;
  }
}
function wrap(s, n) { const out = []; let line = ''; for (const w of s.split(' ')) { if ((line + ' ' + w).trim().length > n) { out.push(line.trim()); line = w; } else line += ' ' + w; } if (line.trim()) out.push(line.trim()); return out; }

// ---------- fit canvas ----------
function fit() {
  const dpr = window.devicePixelRatio || 1, s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = (W * s) + 'px'; cv.style.height = (H * s) + 'px';
  cv.style.marginTop = ((innerHeight - H * s) / 2) + 'px';
  cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr);
  cx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
}
addEventListener('resize', fit); fit();

// ---------- human input ----------
function humanRestart() { if (S.over && performance.now() - overAt > 400) { reset(Date.now() & 0x7fffffff); return true; } return false; }
function firstInput() { if (FX.hintA >= 1) FX.hintA = 0.999; }
const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };
const FIREKEYS = { Space: 1, ArrowUp: 1, KeyW: 1, Enter: 1 };
addEventListener('keydown', e => {
  audioInit();
  if (S.over) { humanRestart(); e.preventDefault(); return; }
  const k = KEYMAP[e.code];
  if (k) { held[k] = true; S.botRot = 0; S.touchAim = null; firstInput(); e.preventDefault(); }
  else if (FIREKEYS[e.code]) { if (!e.repeat) { S.fireQ = true; firstInput(); } e.preventDefault(); }
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) held[k] = false; });
function aimFromPointer(e) {
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
  let a = Math.atan2(x - LX, LY - Math.min(y, LY - 8));
  return Math.max(-AIM_MAX, Math.min(AIM_MAX, a));
}
let dragging = false;
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audioInit();
  if (e.pointerType !== 'mouse') touchUI = true;
  if (S.over) { humanRestart(); return; }
  dragging = true; S.botRot = 0; S.touchAim = aimFromPointer(e); firstInput();
});
cv.addEventListener('pointermove', e => {
  if (S.over) return;
  if (dragging || e.pointerType === 'mouse') { S.touchAim = aimFromPointer(e); }
});
addEventListener('pointerup', e => {
  if (!dragging) return; dragging = false;
  if (!S.over) { S.touchAim = aimFromPointer(e); S.fireQ = true; }
});
addEventListener('pointercancel', () => { dragging = false; });

// ---------- main loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(100, now - last); last = now;
  let sdt = dt;
  if (FX.slowmo > 0) { FX.slowmo -= dt; sdt = dt * 0.3; }   // presentation-only slow-mo (real-time play)
  if (!manual) { carry += sdt; while (carry >= STEP) { step(); carry -= STEP; } }
  if ((FX.hintA < 1 && S.t > 2500) || S.t > 25000) FX.hintA = Math.max(0, FX.hintA - dt / 2500);
  render();
  requestAnimationFrame(frame);
}

// ---------- bot API ----------
window.__game = {
  reset(seed) { manual = true; reset(seed); },
  getState() {
    const pl = S.planets.filter(p => p.r > 0).map(p => ({ x: p.x, y: p.y, r: p.r, k: p.k, halo: p.r * HALO }));
    return {
      t: S.t, score: S.score, over: S.over, cause: S.over ? S.cause : null, difficulty: S.diff, level: S.level, hearts: S.hearts,
      aim: S.aim, aimMax: AIM_MAX, cool: S.cool, inv: S.inv, streak: S.streak, launcher: { x: LX, y: LY }, center: { x: CX, y: CY }, rim: RA,
      v0: launchSpeed(S.planets), planets: pl, shifting: !!S.shift, aimHits: S.over ? 0 : computePreview().hits.filter(h => !h.cap).length,
      stars: S.stars.map(s => ({ x: s.x, y: s.y, r: SHIT, fuse: s.fuse })),
      bodies: S.bodies.map(b => ({ id: b.id, n: b.n, x: b.x, y: b.y, vx: b.vx, vy: b.vy, live: b.live, cap: !!b.cap, loose: !!b.loose, hit: !!b.ok, kind: b.kind })),
      stats: S.st, safeMax: SAFE_MAX, fired: S.fired, safe: S.bodies.filter(b => b.cap).length, loose: S.bodies.filter(b => b.loose).length,
    };
  },
  getActions() { return S.over ? ['none'] : ['none', 'left', 'right', 'fire']; },
  input(a) {
    if (S.over) return;
    if (a === 'left') S.botRot = -1; else if (a === 'right') S.botRot = 1;
    else if (a === 'none') S.botRot = 0;
    else if (a === 'fire') { S.botRot = 0; S.fireQ = true; }
  },
  tick(ms) { carry += ms; while (carry >= STEP) { step(); carry -= STEP; } },
  isOver() { return S.over; },
  score() { return S.score; },
  snapshot() { return structuredClone({ S, carry }); },
  restore(s) { const c = structuredClone(s); S = c.S; carry = c.carry; },
  quiet(b) { QUIET = !!b; },
  render() { render(); },
};

reset(Date.now() & 0x7fffffff);
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
