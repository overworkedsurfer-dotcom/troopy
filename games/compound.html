<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>COMPOUND</title>
<meta name="description" content="A three-minute incremental race: build a tiny 4x4 money engine whose adjacency combos compound faster than an accelerating tide. Your score is how far above the tide you stay.">
<style>
  html,body{margin:0;height:100%;background:#060b18;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block;margin:0 auto}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';
const ID = 'compound';
const W = 480, H = 840;
const STEP = 1000 / 60;
const cv = document.getElementById('c'), cx = cv.getContext('2d');

// ---------- layout ----------
const GN = 4, NC = GN * GN, CS = 84, GAP = 6, GW = GN * CS + (GN - 1) * GAP, GX = (W - GW) / 2, GY = 262;
const CH_X = 16, CH_Y = 132, CH_W = 448, CH_H = 112;            // duel chart
const INFO_Y = 636;
const SH_Y = 652, SH_H = 134, SH_W = 146, SH_GAP = 5, SH_X = (W - (3 * SH_W + 2 * SH_GAP)) / 2;
const RR = { x: 16, y: 796, w: 150, h: 34 };                    // reroll button
const SEED = 0, MILL = 1, BANK = 2, LENS = 3, FURN = 4;
const NAMES = ['SEED', 'MILL', 'BANK', 'LENS', 'FURNACE'];
const TCOL = ['#3ee6a8', '#ffa94d', '#ffd166', '#b794ff', '#ff5d73'];
const TRGB = ['62,230,168', '255,169,77', '255,209,102', '183,148,255', '255,93,115'];
const T0 = 10, R0 = 0.02, TAU = 46;                              // tide: ln T = ln T0 + R0·TAU·(e^(t/TAU) − 1)
const GRACE = 1000;                                              // ms you may spend under the tide before it takes you
const VAULT = 10;                                                // banks pay interest (and score accrues) on up to ×10 the tide
const PTS = 10;                                                  // score per second = PTS × your margin above the tide
const RAIL = 1.05;                                               // you can't buy your way below ×1.05 of the tide
const MILESTONES = [2, 5, 10];
const N4 = [[-1, 0], [1, 0], [0, -1], [0, 1]];
const FONT = '"Trebuchet MS","Segoe UI",Verdana,system-ui,sans-serif';
const MONO = 'ui-monospace,"DejaVu Sans Mono",Menlo,Consolas,monospace';
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

// ---------- seeded RNG (state lives in S.rng) ----------
function rnd() {
  let t = (S.rng = (S.rng + 0x6D2B79F5) | 0);
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

// ---------- best score ----------
function loadBest() { try { return +localStorage.getItem('funlab.' + ID + '.best') || 0; } catch (e) { return 0; } }
function saveBest(v) { try { localStorage.setItem('funlab.' + ID + '.best', String(v)); } catch (e) {} }
let best = loadBest();

// ---------- number formatting ----------
const SUF = ['', 'K', 'M', 'B', 'T'];
function fmt(x, dp) {
  if (!isFinite(x)) return '∞';
  const neg = x < 0; x = Math.abs(x);
  if (x < 1000) return (neg ? '-' : '') + (x < 10 && dp !== 0 ? x.toFixed(1) : Math.floor(x).toString());
  const e = Math.floor(Math.log10(x) / 3);
  // past trillions, named suffixes (Qa, UDc, DDc...) are unreadable: switch to e-notation, e.g. 1.89e40
  if (e >= 5) { const p = Math.floor(Math.log10(x)), m = x / Math.pow(10, p); return (neg ? '-' : '') + m.toFixed(2) + 'e' + p; }
  const v = x / Math.pow(1000, e);
  return (neg ? '-' : '') + (v < 10 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : Math.floor(v).toString()) + SUF[e];
}
function pct(r) { const p = r * 100; return (Math.abs(p) < 10 ? p.toFixed(2) : Math.abs(p) < 100 ? p.toFixed(1) : Math.round(p).toString()) + '%'; }
function xm(m) { return '×' + (m < 10 ? m.toFixed(2) : m < 1000 ? m.toFixed(0) : fmt(m)); }
function xmult(m) { return '×' + (m < 10 ? (Math.round(m * 10) / 10).toString() : Math.round(m).toString()); }

// ---------- tide ----------
function tideLn(tms) { const s = tms / 1000; return Math.log(T0) + R0 * TAU * (Math.exp(s / TAU) - 1); }
function tideBase(tms) { return Math.exp(tideLn(tms)); }
function tideRate(tms) { return R0 * Math.exp(tms / 1000 / TAU); }
function swell(tms) { const s = tms / 1000, A = 0.04 + 0.06 * Math.min(1, s / 150); return A * (0.5 + 0.5 * Math.sin(s * 6.283 / 6.5)); }
function rogueAt(tms) { const r = S.rogue; if (tms < r.at || tms > r.at + r.dur) return 0; const u = (tms - r.at) / r.dur, s = Math.sin(Math.PI * u); return r.amp * s * s; }
function tideEff(tms) { return tideBase(tms) * (1 + swell(tms) + rogueAt(tms)); }
function margin() { const m = S.W / tideEff(S.t); return isFinite(m) ? m : 0; }

// ---------- state ----------
let S = null, FX = null;
let QUIET = false, manual = false, carry = 0, overAt = 0, touchMode = false;
try { touchMode = matchMedia('(pointer: coarse)').matches; } catch (e) {}

function newState(seed) {
  return {
    rng: (seed | 0) || 1, t: 0, score: 0, pts: 0, over: false, cause: null,
    W: 30, grid: new Array(NC).fill(null), mult: new Array(NC).fill(1), out: new Array(NC).fill(0), F: 0, B: 0,
    cur: 5, sel: -1, arm: -1, armT: 0, shop: [], rerolls: 0, buys: 0, count: 0, under: 0, freeze: 0, q: [],
    rogue: { at: 0, amp: 0, dur: 0, warned: false }, lastBuy: null, maxGrowth: 0, peakM: 3, bestMult: 1, msArm: [false, true, true],   // run starts at ~×3: the ×2 milestone arms only after you dip below ×1.6
  };
}
function newFX() {
  return { parts: [], texts: [], coins: [], pops: [], hist: [], tile: new Array(NC).fill(0), tileSq: new Array(NC).fill(0), cardPop: [0, 0, 0], deny: [0, 0, 0],
    shake: 0, flash: 0, flashCol: '255,255,255', dispW: 30, dispS: 0, sPulse: 0, wPulse: 0, water: 0.5, time: 0, beat: 0, nextBeat: 0, rogueWarn: 0,
    fly: null, overT: 0, newBest: false, hintA: 1, introA: 1, rerollPop: 0, center: null, sampleT: 0, coinSnd: 0, selA: 0 };
}
function reset(seed) {
  S = newState(seed); FX = newFX(); carry = 0; drag = null;
  S.shop = [genCard(SEED), genCard(MILL), genCard(SEED)];
  planRogue(18000);
  recompute();
}
function planRogue(after) { S.rogue = { at: S.t + after + rnd() * 22000, amp: 0.22 + rnd() * 0.3, dur: 2600 + rnd() * 1400, warned: false }; }

// ---------- cards ----------
// Alone, Seeds and Banks are weak. Mills (×2 to neighbours) and Lenses (×2 to a row/column) are where growth comes from.
function genCard(force) {
  const s = S.t / 1000;
  let t = force;
  if (t == null) {
    const w = s < 30 ? [0.34, 0.28, 0.16, 0.12, 0.10] : [0.2, 0.26, 0.26, 0.16, 0.12];
    let r = rnd(), i = 0; while (i < 4 && r >= w[i]) { r -= w[i]; i++; } t = i;
  }
  const q = rnd(), rr = rnd(), rar = rr < 0.03 ? 2 : rr < 0.15 ? 1 : 0;      // RARE / LEGENDARY cards
  const boost = [1, 1.6, 2.2][rar], pm = [1, 1.35, 1.8][rar];
  let c;
  if (t === SEED) { const k = 0.02 + 0.015 * q; c = { t, k: k * boost, o: 0, p: 0.22 * k / 0.0275 * pm }; }
  else if (t === BANK) { const k = 0.006 + 0.006 * q; c = { t, k: k * boost, o: 0, p: 0.75 * k / 0.009 * pm }; }
  else if (t === MILL) c = { t, k: [2, 2.5, 3][rar], o: 0, p: 0.5 * pm };
  else if (t === LENS) c = { t, k: [2, 2.5, 3][rar], o: q < 0.5 ? 0 : 1, p: 0.85 * pm };
  else { const k = 0.08 + 0.06 * q; c = { t: FURN, k: k * boost, o: 0, p: 0.6 * k / 0.11 * pm }; }
  c.rar = rar;
  return c;
}
function priceOf(c) { return c.p * (1 + 0.1 * S.count) * tideBase(S.t); }
function rerollCost() { return 0.1 * Math.pow(1.6, S.rerolls) * tideBase(S.t); }
function canAfford(price) { return S.W - price >= tideEff(S.t) * RAIL; }
function tileOf(c) { return { t: c.t, v: c.t === BANK ? c.k : (c.t === SEED || c.t === FURN) ? c.k * tideBase(S.t) : 0, o: c.o, k: c.k, rar: c.rar }; }

// ---------- economy: multiplicative adjacency ----------
function multAt(g, i) {
  const r = (i / GN) | 0, c = i % GN;
  let m = 1;
  for (const d of N4) {
    const rr = r + d[0], cc = c + d[1]; if (rr < 0 || rr >= GN || cc < 0 || cc >= GN) continue;
    const n = g[rr * GN + cc]; if (!n) continue;
    if (n.t === MILL) m *= n.k; else if (n.t === FURN) m *= 0.5;
  }
  let lr = 1, lc = 1;                                         // lenses focus, they don't stack: best row lens × best column lens
  for (let k = 0; k < GN; k++) {
    const a = g[r * GN + k], b = g[k * GN + c];
    if (k !== c && a && a.t === LENS && a.o === 0 && a.k > lr) lr = a.k;
    if (k !== r && b && b.t === LENS && b.o === 1 && b.k > lc) lc = b.k;
  }
  return m * lr * lc;
}
function engineOf(g) {
  let F = 0, B = 0;
  for (let i = 0; i < NC; i++) { const n = g[i]; if (!n || n.t === MILL || n.t === LENS) continue; const v = n.v * multAt(g, i); if (n.t === BANK) B += v; else F += v; }
  return { F, B };
}
function recompute() {
  let F = 0, B = 0;
  for (let i = 0; i < NC; i++) {
    const n = S.grid[i];
    if (!n || n.t === MILL || n.t === LENS) { S.mult[i] = 1; S.out[i] = 0; continue; }
    const m = multAt(S.grid, i); S.mult[i] = m; S.out[i] = n.v * m;
    if (m > S.bestMult) S.bestMult = m;
    if (n.t === BANK) B += n.v * m; else F += n.v * m;
  }
  S.F = F; S.B = B;
}
function vaultCap() { return VAULT * tideBase(S.t); }
function interestOn() { return Math.min(S.W, vaultCap()); }
function growthOf(F, B, W) { return (F + B * Math.min(W, vaultCap())) / Math.max(1e-300, W); }
function growth() { return growthOf(S.F, S.B, S.W); }
function gainAt(c, i) {                       // growth (%/s) this card would add on cell i, paying for it now
  const g = S.grid.slice(); g[i] = tileOf(c);
  const e = engineOf(g), W1 = Math.max(1e-300, S.W - priceOf(c));
  return growthOf(e.F, e.B, W1) - growthOf(S.F, S.B, W1);
}
function nearestEmpty(from) {
  let bi = -1, bd = 1e9; const r0 = (from / GN) | 0, c0 = from % GN;
  for (let i = 0; i < NC; i++) if (!S.grid[i]) { const d = Math.abs(((i / GN) | 0) - r0) + Math.abs(i % GN - c0); if (d < bd) { bd = d; bi = i; } }
  return bi;
}
function nextEmpty(from) {
  for (let k = 1; k <= NC; k++) { const i = (from + k) % NC; if (!S.grid[i]) return i; }
  return (from + 1) % NC;                     // board full: walk every cell (replacing needs a confirm)
}

// ---------- audio (lazy, fail-safe) ----------
let AC = null, AU = null;
function audioInit() {
  try {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      const m = AC.createGain(); m.gain.value = 0.7;
      const comp = AC.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
      m.connect(comp); comp.connect(AC.destination);
      const nb = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate), d = nb.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      // ocean bed: looped noise through a lowpass, swelling with the tide
      const src = AC.createBufferSource(); src.buffer = nb; src.loop = true;
      const of = AC.createBiquadFilter(); of.type = 'lowpass'; of.frequency.value = 400; const og = AC.createGain(); og.gain.value = 0.0;
      src.connect(of); of.connect(og); og.connect(m); src.start();
      AU = { m, noise: nb, of, og };
    }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { AC = null; AU = null; }
}
function aerr(e) { try { const a = window.__audioErr || (window.__audioErr = []); if (a.length < 20) a.push(String(e && e.message || e)); } catch (_) {} }
function live() { return !QUIET && AC && AU && AC.state === 'running'; }
function sfx(fn) { if (!live()) return; try { fn(AC.currentTime); } catch (e) { aerr(e); } }
function tone(at, type, f, dur, v, f2) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, at); if (f2) o.frequency.exponentialRampToValueAtTime(f2, at + dur);
  g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(v, at + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g); g.connect(AU.m); o.start(at); o.stop(at + dur + 0.03);
}
function hiss(at, dur, type, f, q, v, f2) {
  const s = AC.createBufferSource(), fl = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = AU.noise; fl.type = type; fl.frequency.setValueAtTime(f, at); if (f2) fl.frequency.exponentialRampToValueAtTime(f2, at + dur); fl.Q.value = q;
  g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(v, at + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  s.connect(fl); fl.connect(g); g.connect(AU.m); s.start(at, Math.random()); s.stop(at + dur + 0.03);
}
const PENTA = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26, 28, 31];
function nhz(semi) { return 523.25 * Math.pow(2, semi / 12); }

// ---------- FX helpers (never touch S) ----------
function cellXY(i) { return { x: GX + (i % GN) * (CS + GAP) + CS / 2, y: GY + ((i / GN) | 0) * (CS + GAP) + CS / 2 }; }
function cardXY(k) { return { x: SH_X + k * (SH_W + SH_GAP) + SH_W / 2, y: SH_Y + SH_H / 2 }; }
function burst(x, y, n, col, spd, g) {
  if (QUIET) return;
  for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, s = (0.3 + Math.random()) * (spd || 4); FX.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, g: g == null ? 0.12 : g, life: 1, dl: 0.02 + Math.random() * 0.02, col, sz: 2 + Math.random() * 3 }); }
}
function floatText(x, y, txt, col, size, vy) { if (!QUIET) FX.texts.push({ x, y, txt, col, size: size || 16, life: 1, vy: vy == null ? -1.6 : vy }); }
function shake(a) { if (!QUIET) FX.shake = Math.max(FX.shake, a); }
function flash(a, col) { if (!QUIET) { FX.flash = Math.max(FX.flash, a); FX.flashCol = col || '255,255,255'; } }
function center(txt, sub, col, dur) { if (!QUIET) FX.center = { txt, sub, col, life: 1, dl: 1 / ((dur || 1400) / STEP) }; }

// ---------- actions ----------
function act(a) {
  if (a === 'buy1' || a === 'buy2' || a === 'buy3') pressCard(+a[3] - 1);
  else if (a === 'sel1' || a === 'sel2' || a === 'sel3') select(+a[3] - 1);
  else if (a === 'place') { if (S.sel >= 0) place(); }
  else if (a === 'reroll') reroll();
  else if (a === 'desel') { S.sel = -1; S.arm = -1; }
  else if (a.startsWith('cell')) { const k = clamp(+a.slice(4) | 0, 0, NC - 1); if (k !== S.cur) S.arm = -1; S.cur = k; if (S.sel >= 0) place(); else cursorFx(); }
  else moveCur(a);
}
function pressCard(k) { if (!S.shop[k]) return; if (S.sel !== k) select(k); else place(); }
function select(k) {
  if (!S.shop[k]) return;
  S.sel = k; S.arm = -1;
  { const h = heatMap(); if (h && h.bestI >= 0) S.cur = h.bestI; }   // the cursor jumps to ★ best, so pressing again builds where the panel says
  if (QUIET) return;
  FX.cardPop[k] = 1; FX.selA = 0; FX.tile[S.cur] = Math.max(FX.tile[S.cur], 0.6);
  sfx(t => { tone(t, 'triangle', 660, 0.07, 0.06); tone(t + 0.05, 'triangle', 990, 0.09, 0.05); });
}
function place() {
  const k = S.sel; if (k < 0 || !S.shop[k]) return;
  const i = S.cur, old = S.grid[i];
  if (old && S.arm !== i) {                                   // never overwrite by accident: replacing needs a second press
    S.arm = i; S.armT = S.t;
    if (!QUIET) {
      center('REPLACE ' + (old.t === MILL || old.t === LENS ? xmult(old.k) + ' ' : '') + NAMES[old.t] + '?', touchMode ? 'tap it again to confirm' : 'press ' + (k + 1) + ' again to confirm', '#ffb84d', 2200);
      FX.tile[i] = 1; sfx(t => { tone(t, 'square', 520, 0.08, 0.05); tone(t + 0.1, 'square', 520, 0.08, 0.05); });
    }
    return;
  }
  buy(k, i);
}
function buy(slot, i) {
  const c = S.shop[slot]; if (!c) return;
  const price = priceOf(c);
  if (!canAfford(price)) {
    if (!QUIET) { FX.deny[slot] = 1; center('CAN’T AFFORD', 'that buy would sink you under the tide', '#ff5d73', 1500); shake(4); sfx(t => tone(t, 'square', 110, 0.2, 0.09, 80)); }
    return;
  }
  const old = S.grid[i], prevOut = S.out.slice(), g0 = growth(), m0 = margin();
  S.W -= price;
  S.grid[i] = tileOf(c);
  if (!old) S.count++;
  recompute();
  S.shop[slot] = genCard(); S.rerolls = 0; S.buys++; S.sel = -1; S.arm = -1;
  S.lastBuy = { t: S.t, name: NAMES[c.t], m: margin() };
  const g1 = growth();
  const chain = [];
  for (let j = 0; j < NC; j++) if (j !== i && S.grid[j] && Math.abs(S.out[j] - prevOut[j]) > 1e-12 * (1 + prevOut[j])) chain.push(j);
  const dist = j => Math.abs(j % GN - i % GN) + Math.abs(((j / GN) | 0) - ((i / GN) | 0));
  chain.sort((a, b) => dist(a) - dist(b));
  S.freeze = Math.min(220, 40 + chain.length * 30);           // hitstop: the tide holds while the combo lands
  { const ni = nearestEmpty(i); if (ni >= 0) S.cur = ni; }   // auto-cursor only ever lands on an EMPTY cell
  if (QUIET) return;
  const p = cellXY(i), from = cardXY(slot);
  FX.fly = { x0: from.x, y0: from.y, x1: p.x, y1: p.y, t: 0, col: TCOL[c.t], type: c.t, o: c.o };
  FX.tileSq[i] = 1; FX.cardPop[slot] = 1;
  burst(p.x, p.y, 22, TCOL[c.t], 4.5);
  floatText(W - 62, 118, '−$' + fmt(price), '#ff8fa0', 15, -0.5);
  if (old) floatText(p.x, p.y - 34, NAMES[old.t] + ' replaced', '#aab', 13, -0.8);
  const own = S.mult[i];
  if (S.out[i] > 0 && own > 1.01) floatText(p.x, p.y + 30, xmult(own) + ' COMBO', own >= 8 ? '#ff7ae0' : '#ffd166', 16 + Math.min(10, own), -0.9);
  chain.forEach((j, k) => {
    const nm = S.out[j] / Math.max(1e-300, prevOut[j]);
    FX.pops.push({ i: j, d: 6 + k * 5, txt: xmult(S.mult[j]), up: nm >= 1, k });
  });
  const dg = g1 - g0, big = dg > 0.05 || own >= 8 || c.rar === 2;
  shake(big ? 10 : 4 + Math.min(6, chain.length));
  if (big) { center(dg > 0.05 ? '+' + pct(dg) + '/s GROWTH' : c.rar === 2 ? '★ LEGENDARY ★' : xmult(own) + ' COMBO!', 'your engine just compounded', '#ffd166', 1300); flash(0.3, '255,209,102'); burst(W / 2, 60, 40, '#ffd166', 6, 0.05); }
  else if (S.out[i] > 0 && own <= 1.01 && S.buys > 2) floatText(p.x, p.y + 30, 'no combo', '#8899aa', 13, -0.6);
  if (c.rar) floatText(p.x, p.y - 50, c.rar === 2 ? 'LEGENDARY!' : 'RARE!', c.rar === 2 ? '#ff7ae0' : '#ffe08a', 14, -0.6);
  sfx(t => {
    tone(t, 'square', 1318, 0.09, 0.07); tone(t + 0.06, 'square', 1760, 0.22, 0.07); hiss(t, 0.12, 'bandpass', 6000, 2, 0.06);
    tone(t, 'sine', 196, 0.25, 0.18, 98);
    if (big) [0, 4, 7, 12, 16].forEach((s, k) => tone(t + 0.25 + k * 0.05, 'triangle', nhz(s), 0.4, 0.06));
  });
}
function reroll() {
  const c = rerollCost();
  if (!canAfford(c)) { if (!QUIET) { center('CAN’T AFFORD A REROLL', 'too close to the tide', '#ff5d73', 1300); sfx(t => tone(t, 'square', 110, 0.16, 0.08, 80)); } return; }
  S.W -= c; S.rerolls++; S.sel = -1; S.arm = -1;
  S.shop = [genCard(), genCard(), genCard()];
  if (!QUIET) {
    FX.rerollPop = 1; FX.cardPop = [1, 1, 1]; floatText(W - 62, 118, '−$' + fmt(c), '#ff8fa0', 15, -0.5);
    for (let k = 0; k < 3; k++) { const p = cardXY(k); burst(p.x, p.y, 8, '#9fb4ff', 3); }
    sfx(t => { hiss(t, 0.25, 'bandpass', 800, 3, 0.12, 5000); for (let k = 0; k < 3; k++) tone(t + k * 0.05, 'triangle', 660 + k * 220, 0.06, 0.05); });
  }
}
function moveCur(a) {
  S.arm = -1;
  if (a === 'next') S.cur = nextEmpty(S.cur);

}
function wrapText(txt, x, y, maxW, lh) {
  const words = txt.split(' '); let line = '', yy = y;
  for (const w of words) { const t = line ? line + ' ' + w : w; if (cx.measureText(t).width > maxW && line) { cx.fillText(line, x, yy); line = w; yy += lh; } else line = t; }
  if (line) cx.fillText(line, x, yy);
}

// ---------- fit canvas ----------
function fit() {
  const dpr = window.devicePixelRatio || 1, s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = (W * s) + 'px'; cv.style.height = (H * s) + 'px';
  cv.style.marginTop = ((innerHeight - H * s) / 2) + 'px';
  cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr);
  cx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
}
addEventListener('resize', fit); fit();

// ---------- human input ----------
let drag = null;
function queue(a) { if (S && !S.over && S.q.length < 8) S.q.push(a); }
function humanRestart() { if (S.over) { if (performance.now() - overAt > 400) reset(Date.now() & 0x7fffffff); return true; } return false; }
const KEYMAP = { Digit1: 'buy1', Digit2: 'buy2', Digit3: 'buy3', Numpad1: 'buy1', Numpad2: 'buy2', Numpad3: 'buy3', KeyR: 'reroll',
  Space: 'place', Enter: 'place', NumpadEnter: 'place', Escape: 'desel',
  ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', KeyW: 'up', KeyS: 'down', KeyA: 'left', KeyD: 'right', Tab: 'next', KeyN: 'next' };
addEventListener('keydown', e => {
  audioInit();
  if (e.repeat) return;
  if (humanRestart()) return;
  const a = KEYMAP[e.code]; if (a) { e.preventDefault(); queue(a); }
});
function hitTest(x, y) {
  for (let k = 0; k < 3; k++) { const cx0 = SH_X + k * (SH_W + SH_GAP); if (x >= cx0 && x <= cx0 + SH_W && y >= SH_Y - 8 && y <= SH_Y + SH_H) return { card: k }; }
  if (x >= RR.x && x <= RR.x + RR.w && y >= RR.y - 4 && y <= RR.y + RR.h + 4) return { reroll: true };
  const c = Math.floor((x - GX) / (CS + GAP)), r = Math.floor((y - GY) / (CS + GAP));
  if (c >= 0 && c < GN && r >= 0 && r < GN) return { cell: r * GN + c };
  return null;
}
function toLogical(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); if (e.pointerType === 'touch') touchMode = true;
  audioInit(); if (humanRestart()) return;
  const p = toLogical(e), h = hitTest(p.x, p.y); if (!h) return;
  if (h.cell != null) queue('cell' + h.cell);
  else if (h.reroll) queue('reroll');
  else if (h.card != null) drag = { card: h.card, x: p.x, y: p.y, moved: false };
});
cv.addEventListener('pointermove', e => { if (!drag) return; const p = toLogical(e); if (Math.hypot(p.x - drag.x, p.y - drag.y) > 12) drag.moved = true; });
addEventListener('pointerup', e => {
  if (!drag) return;
  const d = drag; drag = null;
  const p = toLogical(e), h = hitTest(p.x, p.y);
  if (d.moved && h && h.cell != null) { queue('sel' + (d.card + 1)); queue('cell' + h.cell); }   // drag a card onto a cell
  else if (!d.moved || (h && h.card === d.card)) queue(S.sel === d.card ? 'place' : 'sel' + (d.card + 1));   // tap: select (tap again: build on the cursor)
});
cv.addEventListener('contextmenu', e => e.preventDefault());

// ---------- main loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(100, now - last); last = now;
  if (!manual) { carry += dt; while (carry >= STEP - 1e-6) { step(); carry -= STEP; } }
  render();
  requestAnimationFrame(frame);
}

// ---------- bot API ----------
// buyN: select card N; pressing the selected card's buyN again builds it on the cursor (a filled cursor cell needs one more
// press to confirm the replace). next: cursor to the next EMPTY cell (every cell once the board is full).
function actions() {
  if (S.over) return ['none'];
  const a = ['none'];
  for (let k = 0; k < 3; k++) if (S.shop[k]) a.push('buy' + (k + 1));
  a.push('next');
  if (canAfford(rerollCost())) a.push('reroll');
  return a;
}
const VALID = { none: 1, buy1: 1, buy2: 1, buy3: 1, next: 1, reroll: 1 };
window.__game = {
  reset(seed) { manual = true; reset(seed); },
  getState() {
    const Tb = tideBase(S.t), Te = tideEff(S.t);
    return {
      t: S.t, score: S.score, over: S.over, cause: S.cause, difficulty: tideRate(S.t),
      wealth: S.W, vault: vaultCap(), tide: Te, tideBase: Tb, tideRate: tideRate(S.t), margin: margin(), income: S.F, interest: S.B, growth: growth(),
      scoreRate: PTS * clamp(margin(), 0, VAULT), under: S.under, grace: GRACE, freeze: S.freeze, cursor: S.cur, sel: S.sel, arm: S.arm, count: S.count, buys: S.buys,
      rogue: S.rogue.warned ? { at: S.rogue.at, amp: S.rogue.amp, dur: S.rogue.dur, warned: true } : null, swellNow: swell(S.t),
      tideParams: { T0, R0, TAU, VAULT, PTS, RAIL, GN },
      grid: S.grid.map((n, i) => n ? { t: n.t, v: n.v, o: n.o, k: n.k, mult: S.mult[i], out: S.out[i] } : null),
      shop: S.shop.map(c => ({ t: c.t, k: c.k, o: c.o, rar: c.rar, price: priceOf(c), afford: canAfford(priceOf(c)) })),
      rerollCost: rerollCost(), types: { SEED, MILL, BANK, LENS, FURN },
    };
  },
  getActions() { return actions(); },
  input(a) { if (a === 'none' || !VALID[a] || !actions().includes(a)) return; queue(a); },
  tick(ms) { carry += ms; while (carry >= STEP - 1e-6) { step(); carry -= STEP; } },
  isOver() { return S.over; },
  score() { return S.score; },
  snapshot() { return structuredClone({ S, carry }); },
  restore(s) { const c = structuredClone(s); S = c.S; carry = c.carry; },
  quiet(b) { QUIET = !!b; },
  render() { render(); },
};

reset(Date.now() & 0x7fffffff);
requestAnimationFrame(frame);
})();
</script>
</body>
