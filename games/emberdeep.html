  canvas{display:block;margin:0 auto}

<body>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';
const ID = 'emberdeep';
const W = 480, H = 830, STEP = 1000 / 60;
const COLS = 15, ROWS = 21, CELL = 30, MX = 15, MY = 102, NT = COLS * ROWS, MAPW = COLS * CELL, MAPH = ROWS * CELL;
const BAR_Y = MY + MAPH + 4;
const WALL = 0, FLOOR = 1, STAIRS = 2, BRAZ = 3, BRAZ_LIT = 4, MAXHP = 16;
const cv = document.getElementById('c'), cx = cv.getContext('2d');
const FONT = "'Trebuchet MS', 'Segoe UI', Verdana, sans-serif";
const F = (sz, w) => (w || '700') + ' ' + sz + 'px ' + FONT;
const C = {
  bg: '#060407', txt: '#ffecd0', dim: '#a8917c', faint: '#6e5d50', amber: '#ffc56e', ember: '#ff8a2a', red: '#ff4a3a',
  cold: '#8fe9ff', violet: '#a48cff', gold: '#ffd36b', oil: '#57d3bf', moth: '#f1dcb2', husk: '#8a8273',
};
const D4 = [[0, -1], [0, 1], [-1, 0], [1, 0]];
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

// ---------- seeded RNG (state lives in S.rng) ----------
function rnd() {
  let t = (S.rng = (S.rng + 0x6D2B79F5) | 0);
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const ri = n => Math.floor(rnd() * n);
function wpick(list) { let tot = 0; for (const it of list) tot += it[1]; let r = rnd() * tot; for (const it of list) { r -= it[1]; if (r < 0) return it[0]; } return list[list.length - 1][0]; }

// ---------- best score ----------
function loadBest() { try { return +localStorage.getItem('funlab.' + ID + '.best') || 0; } catch (e) { return 0; } }
function saveBest(v) { try { localStorage.setItem('funlab.' + ID + '.best', String(v)); } catch (e) {} }
let best = loadBest();

// ---------- audio (lazy, fail-safe) ----------
let AC = null, NB = null, MASTER = null, DRONE = null;
function audioInit() {
  try {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      MASTER = AC.createGain(); MASTER.gain.value = 0.5; MASTER.connect(AC.destination);
      const len = (AC.sampleRate * 0.8) | 0; NB = AC.createBuffer(1, len, AC.sampleRate);
      const d = NB.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const g = AC.createGain(); g.gain.value = 0;
      const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 200; f.Q.value = 4;
      const o1 = AC.createOscillator(), o2 = AC.createOscillator();
      o1.type = 'sawtooth'; o2.type = 'triangle'; o1.frequency.value = 49; o2.frequency.value = 73.6;
      o1.connect(f); o2.connect(f); f.connect(g); g.connect(MASTER); o1.start(); o2.start();
      DRONE = { g, f, o1, o2 };
    }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { AC = null; }
}
function tone(f, d, type, v, slide, delay) {
  if (QUIET || !AC) return;
  try {
    const t = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f * slide), t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v || 0.1, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(MASTER); o.start(t); o.stop(t + d + 0.03);
  } catch (e) {}
}
function noise(d, v, freq, q, delay, ftype) {
  if (QUIET || !AC || !NB) return;
  try {
    const t = AC.currentTime + (delay || 0), s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
    s.buffer = NB; f.type = ftype || 'bandpass'; f.frequency.value = freq || 1000; f.Q.value = q || 1;
    g.gain.setValueAtTime(v || 0.1, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    s.connect(f); f.connect(g); g.connect(MASTER); s.start(t, Math.random() * 0.5); s.stop(t + d + 0.03);
  } catch (e) {}
}
const SND = {
  step() { tone(70 + Math.random() * 25, 0.07, 'sine', 0.1, 0.7); noise(0.05, 0.06, 500, 1.2, 0, 'lowpass'); },
  wait() { tone(150, 0.09, 'triangle', 0.05, 0.8); noise(0.06, 0.05, 300, 1, 0, 'lowpass'); },
  crackle() { const n = 1 + ((Math.random() * 3) | 0); for (let i = 0; i < n; i++) noise(0.01 + Math.random() * 0.02, 0.05 + Math.random() * 0.07, 2500 + Math.random() * 3500, 3, Math.random() * 0.1, 'highpass'); },
  flutter() { for (let i = 0; i < 6; i++) noise(0.022, 0.06, 700 + i * 60, 5, i * 0.03); },
  flare() { noise(0.7, 0.4, 700, 0.5, 0, 'lowpass'); tone(80, 0.6, 'sine', 0.28, 0.4); tone(260, 0.5, 'sawtooth', 0.05, 3.2); noise(0.5, 0.22, 3200, 0.8, 0.06); },
  hit(big) { tone(big ? 130 : 190, 0.1, 'square', 0.07, 0.5); noise(0.08, 0.22, 900, 1); },
  kill() { noise(0.18, 0.2, 2600, 0.7); tone(520, 0.09, 'triangle', 0.07, 1.6); },
  burn() { noise(0.3, 0.22, 1600, 0.5); tone(240, 0.22, 'sawtooth', 0.04, 0.5); },
  hurt() { tone(150, 0.32, 'sawtooth', 0.13, 0.45); noise(0.25, 0.3, 380, 0.8); },
  ember(n) { const f = 587 * Math.pow(2, (Math.min(n, 10) * 2) / 12); tone(f, 0.09, 'triangle', 0.07); tone(f * 1.5, 0.16, 'sine', 0.05, null, 0.05); },
  brazier() { noise(1.0, 0.38, 600, 0.5, 0, 'lowpass'); tone(98, 0.9, 'sawtooth', 0.06, 2); [392, 523, 659, 784].forEach((f, i) => tone(f, 0.32, 'triangle', 0.05, null, 0.1 + i * 0.07)); },
  wake() { tone(66, 0.45, 'sawtooth', 0.09, 0.7); noise(0.3, 0.1, 200, 1, 0, 'lowpass'); },
  shade() { tone(880, 0.7, 'sine', 0.035, 0.5); tone(1175, 0.6, 'sine', 0.025, 0.6, 0.12); },
  doom() { tone(41, 1.4, 'sawtooth', 0.13, 1.5); tone(43.5, 1.4, 'sawtooth', 0.1, 1.45); noise(1.1, 0.18, 180, 0.7, 0, 'lowpass'); },
  gloom() { tone(62, 0.8, 'sine', 0.12, 0.7); noise(0.6, 0.1, 150, 0.6, 0, 'lowpass'); },
  slam() { tone(52, 0.55, 'sine', 0.32, 0.5); noise(0.45, 0.42, 240, 0.6, 0, 'lowpass'); },
  charge() { tone(180, 0.45, 'sawtooth', 0.05, 2.4); },
  descend() { [523, 440, 349, 262].forEach((f, i) => tone(f, 0.24, 'triangle', 0.08, null, i * 0.09)); noise(0.6, 0.08, 400, 0.6, 0.1, 'lowpass'); },
  pick() { tone(784, 0.1, 'triangle', 0.09); tone(1175, 0.26, 'triangle', 0.07, null, 0.08); tone(1568, 0.3, 'sine', 0.04, null, 0.15); },
  combo(k) { const f = 440 * Math.pow(1.1225, Math.min(k, 12) * 2); tone(f, 0.16, 'square', 0.05); tone(f * 1.5, 0.2, 'triangle', 0.04, null, 0.05); },
  die() { tone(320, 1.8, 'sawtooth', 0.12, 0.12); tone(160, 2.0, 'sine', 0.15, 0.3, 0.2); noise(1.4, 0.25, 300, 0.5, 0, 'lowpass'); },
  oil() { tone(500, 0.07, 'sine', 0.07); tone(760, 0.12, 'sine', 0.05, null, 0.05); },
  deny() { tone(110, 0.14, 'square', 0.05, 0.8); },
  holds() { tone(330, 0.3, 'triangle', 0.07, 1.5); tone(495, 0.4, 'sine', 0.05, 1.5, 0.08); },
};
function droneUpdate() {
  if (!AC || !DRONE || !S) return;
  try {
    const dk = S.over ? 0 : darkness();
    const tgt = S.over ? 0.0001 : 0.018 + dk * 0.075, now = AC.currentTime;
    DRONE.g.gain.setTargetAtTime(tgt, now, 0.5);
    DRONE.o1.frequency.setTargetAtTime(46 + dk * 26, now, 0.8);
    DRONE.o2.frequency.setTargetAtTime(69 + dk * 41, now, 0.8);
    DRONE.f.frequency.setTargetAtTime(150 + dk * 520, now, 0.6);
  } catch (e) {}
}

// ---------- tables ----------
const VERB = { moth: 'devoured by a Moth', husk: 'crushed by a Husk', shade: 'snuffed by a Shade', warden: 'struck down by the Warden' };
const RELICS = {
  lantern:  { name: 'Moth Lantern', code: 'ML', col: '#f4d9a8', w: 1.2, txt: 'Moths killed by fire drop an ember.' },
  iron:     { name: 'Cold Iron', code: 'CI', col: '#a9c2d8', w: 1.2, txt: '+2 bump damage while you are dim.' },
  kindling: { name: 'Kindling', code: 'KI', col: '#ff9a3a', w: 1.2, txt: 'Every kill during a flare makes it burn 1 turn longer.' },
  heart:    { name: 'Ember Heart', code: 'EH', col: '#ff5a4a', w: 1.0, txt: 'Max light +2 (and +2 now), but flares cost 1 more.' },
  purse:    { name: 'Dusk Purse', code: 'DP', col: '#a48cff', w: 1.0, txt: 'Embers are worth ×2 while you are dim.' },
  bellows:  { name: 'Bellows', code: 'BE', col: '#ffd36b', w: 1.0, txt: 'Flares burn 2 tiles out, +2 damage, +2 radius.' },
  tallow:   { name: 'Tallow Pouch', code: 'TP', col: '#57d3bf', w: 1.0, txt: 'Start every new depth with a free oil flask.' },
  crown:    { name: 'Pyre Crown', code: 'PC', col: '#ffb347', w: 0.9, txt: 'Each flare that kills 2+ adds +1 to your ember ×.' },
  wick:     { name: 'Glass Wick', code: 'GW', col: '#c9f0ff', w: 0.8, txt: 'All score ×1.5, but max light −2.' },
  phoenix:  { name: 'Phoenix Ash', code: 'PA', col: '#ff7a2a', w: 0.6, unique: true, txt: 'The first time you would be snuffed, rekindle to full.' },
  teeth:    { name: 'Coal Teeth', code: 'CT', col: '#d89a7a', w: 1.0, txt: 'Bump kills restore 1 light.' },
  brand:    { name: 'Firebrand', code: 'FB', col: '#ff6a3a', w: 1.0, txt: 'Bumps deal +1 and count as fire (Lantern, combos).' },
  hearth:   { name: 'Hearth Pact', code: 'HP', col: '#ffcf8a', w: 0.9, txt: 'Braziers also give +1 max light and pay 30 × depth.' },
  kindle:   { name: 'Rekindle', code: '+5', col: '#ffe6a8', w: 1.5, heal: true, txt: 'No relic: restore 5 light right now.' },
};

// ---------- state ----------
let S = null;            // ALL sim state
let FX = null;           // cosmetic only
let QUIET = false, manual = false, carry = 0, overAt = 0, uiSel = 0, isTouch = false;
const TIPS = {};         // one-time coaching lines (cosmetic, per page load)

function newState(seed) {
  return {
    rng: (seed | 0) || 1, t: 0, score: 0, over: false, cause: null, phase: 'play', depth: 1, floorSeed: 0,
    map: [], room: [], rooms: [], seen: [], vis: [], items: [], en: [], braz: [], nid: 1, stairs: [0, 0], sealed: false,
    px: 0, py: 0, ox: 0, oy: 0, mt: -1e9, act: null, hp: 10, maxHp: 10, oil: 0,
    flareT: 0, flareR: 7, flareId: 0, flareKills: 0, bestCombo: 0,
    relic: { lantern: 0, iron: 0, kindling: 0, heart: 0, purse: 0, bellows: 0, tallow: 0, crown: 0, wick: 0, phoenix: 0, teeth: 0, brand: 0, hearth: 0 },
    embers: 0, emberMult: 1, kills: 0, turn: 0, ft: 0, doomAt: 70, gloom: 0, spawnT: 1, gnawT: 9,
    lock: 0, freeze: 0, buf: null, pendEnemy: false, cards: null, hurtT: -1e9, picked: [],
  };
}
function newFX() {
  return { parts: [], texts: [], rings: [], lunge: {}, shake: 0, flash: 0, flashCol: '#fff', hurt: 0, bloom: 0, banner: null, tip: null,
    time: 0, fl: 0, flV: 0, dispR: 6, disp: 0, hpDisp: 10, overT: 0, deathR: 3, moves: 0, hintA: 1, newBest: false,
    lastPhase: 'play', phaseAt: 0, combo: null, streak: 0, streakT: 0, slamFx: null };
}
function reset(seed) {
  S = newState(seed); FX = newFX(); carry = 0; uiSel = 0;
  genFloor(); S.lock = 250;
  FX.dispR = lightR(); FX.hpDisp = S.hp; FX.phaseAt = performance.now();
  banner('DEPTH 1', 'your light is your life', C.amber);
}

// ---------- helpers ----------
const inB = (x, y) => x >= 0 && y >= 0 && x < COLS && y < ROWS;
const tileAt = (x, y) => inB(x, y) ? S.map[x + y * COLS] : WALL;
const walk = (x, y) => tileAt(x, y) !== WALL;
const tX = x => MX + (x + 0.5) * CELL, tY = y => MY + (y + 0.5) * CELL;
function enemyAt(x, y) { for (const e of S.en) if (!e.dead && e.x === x && e.y === y) return e; return null; }
function adj4(e) { return Math.abs(e.x - S.px) + Math.abs(e.y - S.py) === 1; }
function cheb(e) { return Math.max(Math.abs(e.x - S.px), Math.abs(e.y - S.py)); }
function amb(d) { return -Math.floor((d - 1) / 3); }                     // deeper = darker
function rawLight() { return 1 + Math.ceil(S.hp / 2) + amb(S.depth) - S.gloom; }
function baseLight() { return Math.max(1, Math.min(9, rawLight())); }
function lightR() { const b = baseLight(); return S.flareT > 0 ? Math.max(b, S.flareR) : b; }
function brazLit(x, y) { for (const b of S.braz) if (b.lit) { const dx = x - b.x, dy = y - b.y; if (dx * dx + dy * dy <= 6.25) return true; } return false; }
function isDim() { return S.flareT <= 0 && baseLight() <= 2 && !brazLit(S.px, S.py); }
function mothActs() { return S.depth >= 9 ? 3 : 2; }
function mothSense() { if (S.flareT > 0) return 99; const L = baseLight(); return L <= 2 ? 0 : 2 * L - 2; }
function flareCost() { return 2 + S.relic.heart; }
function canFlare() { return S.phase === 'play' && !S.over && (S.oil > 0 || S.hp > flareCost()); }
function bumpDmg() { return 2 + S.relic.brand + (isDim() ? 2 * S.relic.iron : 0); }
function isReady() { return !S.over && S.lock <= 0 && S.freeze <= 0 && !S.pendEnemy && !S.buf && (S.phase === 'play' || S.phase === 'draft'); }
function darkness() { return Math.min(1, (S.ft / Math.max(1, S.doomAt)) * 0.35 + S.gloom * 0.12 + (isDim() ? 0.25 : 0) + (S.depth - 1) * 0.03); }
function wardenPat(e) { return e.ph2 ? ['move', 'charge', 'slam'] : ['move', 'move', 'charge', 'slam']; }
function wardenNext(e) { const p = wardenPat(e); return p[e.cyc % p.length]; }
function bfs(sx, sy) {
  const d = new Array(NT).fill(999), q = [sx + sy * COLS]; d[q[0]] = 0;
  for (let h = 0; h < q.length; h++) {
    const i = q[h], x = i % COLS, y = (i / COLS) | 0;
    for (const dd of D4) {
      const nx = x + dd[0], ny = y + dd[1];
      if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) continue;
      const ni = nx + ny * COLS;
      if (S.map[ni] === WALL || d[ni] < 999) continue;
      d[ni] = d[i] + 1; q.push(ni);
    }
  }
  return d;
}

// ---------- dungeon generation ----------
function mkEnemy(type, x, y) {
  const d = S.depth;
  let hp, atk;
  if (type === 'moth') { hp = d >= 6 ? 2 : 1; atk = 1; }
  else if (type === 'husk') { hp = 4 + Math.floor(d / 2); atk = d >= 7 ? 3 : 2; }
  else if (type === 'shade') { hp = 2 + Math.floor(d / 6); atk = d >= 6 ? 2 : 1; }
  else { const n = Math.max(1, Math.round(d / 4)); hp = 14 + 8 * (n - 1); atk = 2 + (n - 1); }
  return { id: S.nid++, type, x, y, ox: x, oy: y, mt: -1e9, hp, maxHp: hp, atk, awake: type === 'shade' || type === 'moth',
    aware: false, ready: false, acts: 0, cyc: 0, ph2: false, mark: null, hitT: -1e9, dead: false };
}
function genFloor() {
  const d = S.depth;
  let map, room, rooms;
  for (let attempt = 0; attempt < 30; attempt++) {
    map = new Array(NT).fill(WALL); room = new Array(NT).fill(-1); rooms = [];
    const want = 6 + ri(2);
    for (let tries = 0; tries < 500 && rooms.length < want; tries++) {
      const w = 3 + ri(4), h = 3 + ri(3);
      const x = 1 + ri(COLS - w - 1), y = 1 + ri(ROWS - h - 1);
      let ok = true;
      for (const r of rooms) if (!(x >= r.x + r.w + 1 || r.x >= x + w + 1 || y >= r.y + r.h + 1 || r.y >= y + h + 1)) { ok = false; break; }
      if (ok) rooms.push({ x, y, w, h });
    }
    if (rooms.length >= 5) break;
  }
  rooms.sort((a, b) => (a.y + a.h / 2) - (b.y + b.h / 2) || a.x - b.x);
  rooms.forEach((r, k) => {
    for (let y = r.y; y < r.y + r.h; y++) for (let x = r.x; x < r.x + r.w; x++) { map[x + y * COLS] = FLOOR; room[x + y * COLS] = k; }
    r.cx = r.x + ri(r.w); r.cy = r.y + ri(r.h);
  });
  const carve = (x, y) => { const i = x + y * COLS; if (map[i] === WALL) map[i] = FLOOR; };
  const link = (a, b) => {
    let x = a.cx, y = a.cy;
    if (rnd() < 0.5) { while (x !== b.cx) { x += Math.sign(b.cx - x); carve(x, y); } while (y !== b.cy) { y += Math.sign(b.cy - y); carve(x, y); } }
    else { while (y !== b.cy) { y += Math.sign(b.cy - y); carve(x, y); } while (x !== b.cx) { x += Math.sign(b.cx - x); carve(x, y); } }
  };
  for (let k = 1; k < rooms.length; k++) link(rooms[k - 1], rooms[k]);
  const extra = 1 + ri(2);
  for (let k = 0; k < extra; k++) { const a = ri(rooms.length), b = ri(rooms.length); if (Math.abs(a - b) >= 2) link(rooms[a], rooms[b]); }
  S.map = map; S.room = room; S.rooms = rooms.map(r => ({ x: r.x, y: r.y, w: r.w, h: r.h }));
  const si = rnd() < 0.5 ? 0 : rooms.length - 1, sr = rooms[si];
  S.px = sr.x + ri(sr.w); S.py = sr.y + ri(sr.h); S.ox = S.px; S.oy = S.py; S.mt = -1e9; S.act = null;
  const dist = bfs(S.px, S.py);
  let fr = -1, fd = -1;
  rooms.forEach((r, k) => { if (k === si) return; const dd = dist[r.cx + r.cy * COLS]; if (dd > fd) { fd = dd; fr = k; } });
  const stR = rooms[fr];
  let stx = stR.x + ri(stR.w), sty = stR.y + ri(stR.h);
  map[stx + sty * COLS] = STAIRS; S.stairs = [stx, sty];
  const used = {}; used[S.px + S.py * COLS] = 1; used[stx + sty * COLS] = 1;
  const free = (minD, roomOnly) => {
    const out = [];
    for (let i = 0; i < NT; i++) { if (map[i] !== FLOOR || used[i] || dist[i] < minD || dist[i] >= 999) continue; if (roomOnly && room[i] < 0) continue; out.push(i); }
    return out;
  };
  const take = list => { if (!list.length) return -1; const i = list.splice(ri(list.length), 1)[0]; used[i] = 1; return i; };
  const put = (type, i) => { if (i >= 0) S.en.push(mkEnemy(type, i % COLS, (i / COLS) | 0)); };
  S.en = []; S.items = []; S.braz = [];
  const boss = d % 4 === 0;
  const nM = Math.min(9, (boss ? 1 : 2) + Math.floor(d / 2) + ri(2));
  const nH = boss ? Math.floor(d / 8) : Math.min(6, 1 + Math.floor((d + 1) / 3));
  const nS = d >= 3 ? Math.min(4, 1 + Math.floor((d - 3) / 3)) : 0;
  S.sealed = false;
  if (boss) {
    const near = []; for (let i = 0; i < NT; i++) if (map[i] === FLOOR && !used[i] && room[i] === fr) near.push(i);
    put('warden', take(near.length ? near : free(4, false)));
    S.sealed = true;
  }
  let pool = free(6, true);
  for (let k = 0; k < nM; k++) put('moth', take(pool.length ? pool : free(5, false)));
  for (let k = 0; k < nH; k++) put('husk', take(pool.length ? pool : free(5, false)));
  for (let k = 0; k < nS; k++) {
    const far = []; for (let i = 0; i < NT; i++) { const x = i % COLS, y = (i / COLS) | 0; if (!used[i] && Math.hypot(x - S.px, y - S.py) >= 9) far.push(i); }
    put('shade', take(far));
  }
  // braziers: in the most crowded rooms (the risk is the point)
  const cnt = rooms.map(() => 0); for (const e of S.en) { const r = room[e.x + e.y * COLS]; if (r >= 0) cnt[r]++; }
  const order = rooms.map((r, k) => k).filter(k => k !== si).sort((a, b) => cnt[b] - cnt[a] || a - b);
  const nB = 1 + (d >= 3 && rnd() < 0.5 ? 1 : 0);
  for (let k = 0; k < nB && k < order.length; k++) {

function flareBtn() { return { x: 12, y: BAR_Y + 28, w: 132, h: 56 }; }   // bottom-left: the bottom-right corner belongs to the Arcade link
function drawHUD(t) {

    cx.fillStyle = 'rgba(10,6,8,0.8)'; cx.fillRect(MX + 60, MY + 6, MAPW - 120, 16);

    cx.fillStyle = wd.ph2 ? '#ff5a2a' : '#d8402a'; cx.fillRect(MX + 64, MY + 10, (MAPW - 128) * clamp01(wd.hp / wd.maxHp), 8);
    txt('THE WARDEN ' + wd.hp + '/' + wd.maxHp + (wd.ph2 ? ' · ENRAGED' : ''), W / 2, MY + 14, F(9, '900'), '#ffe0d0', 'center', 2.5);

}
function cardRect(i) { return { x: 34, y: MY + 96 + i * 146, w: W - 68, h: 128 }; }
function drawDraft(t) {
  cx.fillStyle = 'rgba(6,4,7,0.82)'; cx.fillRect(MX, MY, MAPW, MAPH);

// ---------- fit canvas ----------
function fit() {
  const dpr = window.devicePixelRatio || 1, s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = (W * s) + 'px'; cv.style.height = (H * s) + 'px';
  cv.style.marginTop = ((innerHeight - H * s) / 2) + 'px';
  cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr);
  SC = cv.width / W; mapKey = '';
}
addEventListener('resize', fit); fit();

// ---------- input ----------

}
const KEYMAP = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };
addEventListener('keydown', e => {

let ptr = null;
function toLogical(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
cv.addEventListener('pointerdown', e => {

addEventListener('pointerup', e => {

// ---------- main loop ----------
let last = performance.now();

  if (!manual) { carry += dt; while (carry >= STEP) { step(); carry -= STEP; } }
  render(); droneUpdate();
  requestAnimationFrame(frame);
}

window.__game = {

  getState() {

})();
