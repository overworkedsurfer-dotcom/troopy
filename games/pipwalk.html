<!doctype html>
<html lang="en">
<head>

<title>Pipwalk</title>
<meta name="description" content="You are a die. Every roll changes the face on top, and the face on top is your weapon: chain rising faces into absurd multipliers.">
<style>

  canvas{display:block;margin:0 auto}

<body>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';
const ID = 'pipwalk';
const W = 480, H = 800;
const STEP = 1000 / 60;
const GN = 7, CELL = 60, BX = 30, BY = 150;           // 7x7 board, 60px cells
const cv = document.getElementById('c'), cx = cv.getContext('2d');
const FONT = "Inter, 'Trebuchet MS', 'Segoe UI', Verdana, sans-serif";
const F = (sz, w) => (w || '800') + ' ' + sz + 'px ' + FONT;

const C = {
  bg: '#0b1512', felt: '#1f6a52', felt2: '#1b5f49', wood: '#7a4d2b', woodHi: '#a8743f', woodDk: '#3f2615',
  ink: '#2b1e2f', red: '#ff4d5e', gold: '#ffd166', cyan: '#6fdcff', pink: '#ff6fa8', orange: '#ff8a3d',
  yellow: '#ffe04a', purple: '#b07cff', txt: '#f7f0e2', dim: '#9cc3b4', pip1: '#d62839',
};
const KCOL = { '': C.ink, fire: '#f0641e', quake: '#d9a400', ward: '#1f8fd6', heart: '#e0386f', wild: '#8a3fe0' };
const KGLOW = { fire: C.orange, quake: C.yellow, ward: C.cyan, heart: C.pink, wild: C.purple };

// ---------- seeded RNG (state lives in S.rng) ----------
function rnd() {
  let t = (S.rng = (S.rng + 0x6D2B79F5) | 0);
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function ri(n) { return Math.floor(rnd() * n); }
function wpick(list) { let tot = 0; for (const it of list) tot += it[1]; let r = rnd() * tot; for (const it of list) { r -= it[1]; if (r < 0) return it[0]; } return list[list.length - 1][0]; }

// ---------- best score ----------
function loadBest() { try { return +localStorage.getItem('funlab.' + ID + '.best') || 0; } catch (e) { return 0; } }
function saveBest(v) { try { localStorage.setItem('funlab.' + ID + '.best', String(v)); } catch (e) {} }
let best = loadBest();

// ---------- audio (lazy, fail-safe) ----------
let AC = null, NB = null, MASTER = null;
function audioInit() {
  try {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      MASTER = AC.createGain(); MASTER.gain.value = 0.55; MASTER.connect(AC.destination);
      const len = (AC.sampleRate * 0.6) | 0; NB = AC.createBuffer(1, len, AC.sampleRate);
      const d = NB.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { AC = null; }
}
function tone(f, d, type, v, slide, delay) {
  if (QUIET || !AC) return;
  try {
    const t = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f * slide), t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v || 0.1, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(MASTER); o.start(t); o.stop(t + d + 0.03);
  } catch (e) {}
}
function noise(d, v, freq, q, delay, ftype) {
  if (QUIET || !AC || !NB) return;
  try {
    const t = AC.currentTime + (delay || 0), s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
    s.buffer = NB; f.type = ftype || 'bandpass'; f.frequency.value = freq || 1000; f.Q.value = q || 1;
    g.gain.setValueAtTime(v || 0.1, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    s.connect(f); f.connect(g); g.connect(MASTER); s.start(t, Math.random() * 0.4); s.stop(t + d + 0.03);
  } catch (e) {}
}
const PENTA = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26, 28, 31, 33, 36];
const note = n => 261.63 * Math.pow(2, PENTA[Math.max(0, Math.min(PENTA.length - 1, n))] / 12);
const SND = {
  roll() { noise(0.035, 0.16, 2600, 2.5); tone(240, 0.04, 'triangle', 0.05); noise(0.05, 0.24, 1700, 3, 0.11); tone(150, 0.07, 'sine', 0.16, 0.6, 0.11); },
  bonk() { tone(95, 0.09, 'sine', 0.16, 0.6); noise(0.05, 0.1, 420, 1); },
  hit(n, big) { const f = note(n + 2); tone(f, 0.12, 'square', 0.07); tone(f * 1.5, 0.14, 'triangle', 0.07); noise(0.09, big ? 0.4 : 0.25, 700, 0.9); if (big) tone(70, 0.25, 'sine', 0.25, 0.5); },
  kill(n) { const f = note(n + 4); tone(f, 0.07, 'square', 0.07); tone(f * 1.25, 0.08, 'square', 0.06, null, 0.05); tone(f * 1.5, 0.16, 'triangle', 0.08, null, 0.1); noise(0.16, 0.2, 3200, 0.7); },
  hurt() { tone(170, 0.28, 'sawtooth', 0.14, 0.4); noise(0.22, 0.35, 480, 0.8); },
  whiff() { noise(0.13, 0.09, 1500, 0.6); },
  block() { tone(1250, 0.09, 'sine', 0.12); tone(1870, 0.18, 'sine', 0.07, null, 0.04); noise(0.06, 0.15, 5000, 2); },
  heal() { tone(880, 0.08, 'triangle', 0.08); tone(1320, 0.14, 'triangle', 0.07, null, 0.07); },
  quake() { tone(78, 0.35, 'sine', 0.3, 0.5); noise(0.32, 0.35, 220, 0.7, 0, 'lowpass'); },
  ward() { tone(660, 0.2, 'sine', 0.09, 1.5); tone(990, 0.24, 'sine', 0.05, 1.5, 0.04); },
  face(k) { if (k === 'quake') return; tone(1046, 0.08, 'triangle', 0.05); },
  broke() { tone(420, 0.18, 'square', 0.06, 0.45); },
  clear() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.18, 'triangle', 0.09, null, i * 0.07)); noise(0.4, 0.12, 6000, 0.5, 0.3); },
  pick() { tone(784, 0.1, 'triangle', 0.09); tone(1175, 0.22, 'triangle', 0.08, null, 0.07); tone(1568, 0.3, 'sine', 0.05, null, 0.14); },
  dread() { tone(55, 0.7, 'sawtooth', 0.11, 1.6); tone(58.3, 0.7, 'sawtooth', 0.09, 1.5); noise(0.6, 0.15, 160, 0.8, 0, 'lowpass'); },
  tick() { tone(200, 0.05, 'sine', 0.06); },
  die() { tone(330, 0.9, 'sawtooth', 0.14, 0.18); tone(220, 1.0, 'square', 0.06, 0.25, 0.1); noise(0.6, 0.4, 300, 0.5); },
  floor() { tone(392, 0.12, 'triangle', 0.08); tone(523, 0.2, 'triangle', 0.08, null, 0.1); },
  shot() { noise(0.12, 0.18, 2400, 4); tone(900, 0.1, 'sawtooth', 0.04, 0.4); },
  slam() { tone(60, 0.4, 'sine', 0.3, 0.5); noise(0.35, 0.4, 260, 0.6, 0, 'lowpass'); },
};

// ---------- tables ----------
const D4 = [[0, -1], [0, 1], [-1, 0], [1, 0]];
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
const DLIST = ['up', 'down', 'left', 'right'];
const ET = {
  slime:  { name: 'Slime', a: 'a', hp: 3, atk: 1, mv: 1, col: '#9be15d', verb: 'slimed by' },
  skull:  { name: 'Skull', a: 'a', hp: 6, atk: 2, mv: 1, col: '#eadfc8', verb: 'bonked by' },
  archer: { name: 'Archer', a: 'an', hp: 3, atk: 2, mv: 1, col: '#4fd1c5', verb: 'shot by', range: 5 },
  wolf:   { name: 'Wolf', a: 'a', hp: 5, atk: 2, mv: 2, col: '#a3b6e6', verb: 'mauled by' },
  wraith: { name: 'Dread', a: 'the', hp: 4, atk: 2, mv: 1, col: '#b07cff', verb: 'taken by' },
  elite:  { name: 'Elite Knight', a: 'an', hp: 15, atk: 3, mv: 1, col: '#ffcf4a', verb: 'cut down by' },
  boss:   { name: 'Ogre', a: 'the', hp: 16, atk: 3, mv: 1, col: '#ff5a5f', verb: 'crushed by' },
};
const CARDS = {
  plus:   { w: 5,   name: 'Loaded Pips', face: true },
  fire:   { w: 2,   name: 'Flame Face', face: true, kind: 'fire' },
  quake:  { w: 2,   name: 'Quake Face', face: true, kind: 'quake' },
  ward:   { w: 1.8, name: 'Ward Face', face: true, kind: 'ward' },
  heart:  { w: 1.2, name: 'Heart Face', face: true, kind: 'heart' },
  wild:   { w: 1.5, name: 'Wild Face', face: true, kind: 'wild' },
  odds:   { w: 2,   name: 'Odd Luck' },
  evens:  { w: 2,   name: 'Even Keel' },
  twins:  { w: 1.6, name: 'Twin Fangs' },
  stairs: { w: 1.6, name: 'Stairway' },
  vamp:   { w: 1.4, name: 'Vampire Pips' },
  steel:  { w: 1.2, name: 'Steel Nerves', unique: true },
  glass:  { w: 1.1, name: 'Glass Cannon' },
  mom:    { w: 1.3, name: 'Momentum' },
  patch:  { w: 2.5, name: 'Patch Up' },
  over:   { w: 1.1, name: 'Overflow', unique: true },
};

// ---------- state ----------
let S = null;            // ALL sim state
let FX = null;           // cosmetic only
let QUIET = false, manual = false, carry = 0, overAt = 0, uiSel = 0, isTouch = false;

function newChain() { return { n: 0, mult: 1, last: 0, kind: '', vals: [] }; }
function newState(seed) {
  return {
    rng: (seed | 0) || 1, t: 0, score: 0, over: false, cause: null, phase: 'play', floor: 1,
    hp: 10, maxHp: 10, barrier: 0, px: 3, py: 3,
    // faces by id; o = face ids at [Top, Bottom, North, South, East, West]
    die: { f: [{ v: 1, k: '' }, { v: 2, k: '' }, { v: 3, k: '' }, { v: 4, k: '' }, { v: 5, k: '' }, { v: 6, k: '' }], o: [0, 5, 4, 1, 2, 3] },
    relic: { twins: 0, stairs: 0, vamp: 0, steel: 0, glass: 0, mom: 0, over: 0 },
    momentum: 0, chain: newChain(), en: [], nid: 1, dread: 0, dreadSpawns: 0,
    lock: 0, freeze: 0, buf: null, pendEnemy: false, anim: null,
    cards: null, picks: 0, eliteKilled: false, turns: 0, roomTurns: 0, kills: 0, bestHit: 0, maxMult: 1,
    hurtT: -1e9, clearT: -1e9, cardT: -1e9, hurtBy: '',
  };
}
function newFX() {
  return { parts: [], texts: [], rings: [], q: [], shake: 0, flash: 0, flashCol: '#fff', hintA: 1, banner: null,
    hit: {}, lunge: {}, corpses: [], disp: 0, chainPulse: 0, hpPulse: 0, faceFlash: [0, 0, 0, 0, 0, 0], beams: [],
    hurt: 0, overT: 0, moves: 0, zz: 0 };
}
function reset(seed) {
  S = newState(seed); FX = newFX(); carry = 0; uiSel = 0;
  spawnFloor(); S.lock = 300;
  FX.banner = { txt: 'FLOOR 1', sub: 'clear the tray', life: 1, col: C.gold };
}

// ---------- helpers ----------
const inB = (x, y) => x >= 0 && y >= 0 && x < GN && y < GN;
function enemyAt(x, y) { for (const e of S.en) if (!e.dead && e.x === x && e.y === y) return e; return null; }
function topFace() { return S.die.f[S.die.o[0]]; }
function hpMul(f) { return Math.pow(1.32, f - 1); }
function rollO(o, dir) {
  const T = o[0], B = o[1], N = o[2], So = o[3], E = o[4], Wd = o[5];
  if (dir === 'up') return [So, N, T, B, E, Wd];
  if (dir === 'down') return [N, So, B, T, E, Wd];
  if (dir === 'right') return [Wd, E, N, So, T, B];
  return [E, Wd, N, So, B, T];
}
function cellC(x, y) { return [BX + (x + 0.5) * CELL, BY + (y + 0.5) * CELL]; }
function dreadMax() { return Math.max(2, 14 + (S.floor % 5 === 0 ? 4 : 0) - Math.floor((S.floor - 1) / 2) - 2 * S.dreadSpawns); }
function isReady() { return !S.over && S.lock <= 0 && S.freeze <= 0 && !S.pendEnemy && !S.buf && (S.phase === 'play' || S.phase === 'pick'); }

// ---------- spawning ----------
function mkEnemy(type, x, y) {
  const b = ET[type], f = S.floor, am = 1 + 0.15 * (f - 1);
  const dz = type === 'wraith' ? Math.max(0, S.dreadSpawns - 1) : 0;   // each Dread on a floor is tougher than the last
  const hp = Math.max(1, Math.round(b.hp * hpMul(f) * Math.pow(1.35, dz)));
  return { id: S.nid++, type, x, y, ox: x, oy: y, mt: -1e9, st: S.t, hp, maxHp: hp, atk: Math.max(1, Math.round(b.atk * am)) + (dz >> 1),
    mv: b.mv, int: null, dormant: type === 'elite', rest: 0, dead: false };
}
function freeCells(minDist, edgeOnly) {
  const out = [];
  for (let y = 0; y < GN; y++) for (let x = 0; x < GN; x++) {
    if (x === S.px && y === S.py) continue;
    if (enemyAt(x, y)) continue;
    if (edgeOnly && !(x === 0 || y === 0 || x === GN - 1 || y === GN - 1)) continue;
    if (Math.abs(x - S.px) + Math.abs(y - S.py) < minDist) continue;
    out.push([x, y]);
  }
  return out;
}
function spawnAt(type, minDist, edgeOnly) {
  let c = freeCells(minDist, edgeOnly);
  if (!c.length) c = freeCells(2, false);
  if (!c.length) c = freeCells(1, false);
  if (!c.length) return null;
  const p = c[ri(c.length)], e = mkEnemy(type, p[0], p[1]);
  S.en.push(e); return e;
}
function spawnFloor() {
  const f = S.floor; S.en = [];
  const boss = f % 5 === 0;
  let n = Math.min(7, 2 + Math.floor(f / 2));
  if (boss) { spawnAt('boss', 4); n = Math.max(1, n - 2); }
  const pool = [['slime', 3]];
  if (f >= 2) pool.push(['skull', 1.4 + f * 0.15]);
  if (f >= 3) pool.push(['archer', 1.4]);
  if (f >= 4) pool.push(['wolf', 1.3]);
  for (let i = 0; i < n; i++) spawnAt(wpick(pool), 3);
  if (!boss && f >= 2 && rnd() < 0.5) spawnAt('elite', 3);
  for (const e of S.en) planIntent(e);
}

// ---------- enemy AI ----------
function bfsFrom(tx, ty, self) {
  const d = new Array(GN * GN).fill(999), blocked = new Array(GN * GN).fill(false);
  for (const e of S.en) if (!e.dead && e !== self) blocked[e.x + e.y * GN] = true;
  const q = [tx + ty * GN]; d[q[0]] = 0; let h = 0;
  while (h < q.length) {
    const c = q[h++], x = c % GN, y = (c / GN) | 0;
    for (const [dx, dy] of D4) {
      const nx = x + dx, ny = y + dy; if (!inB(nx, ny)) continue;
      const ni = nx + ny * GN; if (blocked[ni] || d[ni] < 999) continue;
      d[ni] = d[c] + 1; q.push(ni);
    }
  }
  return d;
}
function moveE(e, nx, ny) { e.ox = e.x; e.oy = e.y; e.mt = S.t; e.x = nx; e.y = ny; }
function canStep(nx, ny) { return inB(nx, ny) && !(nx === S.px && ny === S.py) && !enemyAt(nx, ny); }
function stepToward(e) {
  const d = bfsFrom(S.px, S.py, e);
  const val = (x, y) => d[x + y * GN] < 999 ? d[x + y * GN] : 500 + Math.abs(S.px - x) + Math.abs(S.py - y);
  const sx = Math.sign(S.px - e.x), sy = Math.sign(S.py - e.y);
  const order = Math.abs(S.px - e.x) >= Math.abs(S.py - e.y)
    ? [[sx || 1, 0], [0, sy || 1], [0, -(sy || 1)], [-(sx || 1), 0]]
    : [[0, sy || 1], [sx || 1, 0], [-(sx || 1), 0], [0, -(sy || 1)]];
  let bestC = null, bv = val(e.x, e.y);
  for (const [dx, dy] of order) {
    const nx = e.x + dx, ny = e.y + dy; if (!canStep(nx, ny)) continue;
    const v = val(nx, ny); if (v < bv) { bv = v; bestC = [nx, ny]; }
  }
  if (bestC) { moveE(e, bestC[0], bestC[1]); return true; }
  return false;
}
function losClear(x0, y0, x1, y1, self) {
  const sx = Math.sign(x1 - x0), sy = Math.sign(y1 - y0); let x = x0 + sx, y = y0 + sy;
  while (x !== x1 || y !== y1) { const o = enemyAt(x, y); if (o && o !== self) return false; x += sx; y += sy; }
  return true;
}
function archerScore(e, x, y) {
  const dx = S.px - x, dy = S.py - y, m = Math.abs(dx) + Math.abs(dy);
  if ((dx === 0 || dy === 0) && m >= 1 && m <= ET.archer.range && losClear(x, y, S.px, S.py, e)) return m * 0.1;
  return 10 + Math.min(Math.abs(dx), Math.abs(dy)) * 3 + m * 0.3;
}
function archerMove(e) {
  let bestC = null, bv = archerScore(e, e.x, e.y);
  for (const [dx, dy] of D4) {
    const nx = e.x + dx, ny = e.y + dy; if (!canStep(nx, ny)) continue;
    const v = archerScore(e, nx, ny); if (v < bv - 0.01) { bv = v; bestC = [nx, ny]; }
  }
  if (bestC) moveE(e, bestC[0], bestC[1]);
}
function planIntent(e) {
  if (e.dead) return;
  const dx = S.px - e.x, dy = S.py - e.y, man = Math.abs(dx) + Math.abs(dy);
  if (e.dormant) { e.int = { type: 'sleep' }; return; }
  if (e.rest > 0) { e.int = { type: 'rest' }; return; }
  if (e.type === 'boss') {
    if (Math.max(Math.abs(dx), Math.abs(dy)) <= 1) {
      const cells = [];
      for (let yy = -1; yy <= 1; yy++) for (let xx = -1; xx <= 1; xx++) if ((xx || yy) && inB(e.x + xx, e.y + yy)) cells.push([e.x + xx, e.y + yy]);
      e.int = { type: 'atk', kind: 'slam', cells };
    } else e.int = { type: 'move' };
    return;
  }
  if (e.type === 'archer') {
    if ((dx === 0 || dy === 0) && man <= ET.archer.range && losClear(e.x, e.y, S.px, S.py, e)) {
      const sx = Math.sign(dx), sy = Math.sign(dy), cells = [];
      for (let i = 1; i <= ET.archer.range; i++) { const x = e.x + sx * i, y = e.y + sy * i; if (!inB(x, y)) break; const o = enemyAt(x, y); if (o && o !== e) break; cells.push([x, y]); }
      e.int = { type: 'atk', kind: 'shot', cells, dir: [sx, sy] };
    } else e.int = { type: 'move' };
    return;
  }
  if (man === 1) e.int = { type: 'atk', kind: 'melee', cells: [[S.px, S.py]] };
  else e.int = { type: 'move' };
}
function execIntent(e) {
  const it = e.int; if (!it || e.dead) return;
  if (it.type === 'atk') {
    const hit = it.cells.some(c => c[0] === S.px && c[1] === S.py);
    if (!QUIET) {
      if (it.kind === 'shot') { const [ax, ay] = cellC(e.x, e.y), last = it.cells[it.cells.length - 1], [bx, by] = cellC(last[0], last[1]); FX.beams.push({ x0: ax, y0: ay - 18, x1: bx, y1: by - 18, life: 1, col: '#ffe9a8' }); SND.shot(); }
      else if (it.kind === 'slam') { const [ax, ay] = cellC(e.x, e.y); ring(ax, ay, C.red, 110, 8); shake(10); SND.slam(); burst(ax, ay, 26, '#c9a27a', 5, { g: 0.2 }); }
      else FX.lunge[e.id] = { dx: S.px - e.x, dy: S.py - e.y, life: 1 };
    }
    if (hit) hurtPlayer(e.atk, e);
    else if (!QUIET && it.kind === 'melee') { const [x, y] = cellC(it.cells[0][0], it.cells[0][1]); ftext(x, y - 6, 'miss', C.dim, 14); SND.whiff(); }
    if (e.type === 'boss') e.rest = 2;
  } else if (it.type === 'move') {
    if (e.type === 'archer') archerMove(e);
    else {
      for (let i = 0; i < e.mv; i++) {
        if (Math.abs(S.px - e.x) + Math.abs(S.py - e.y) <= 1) break;
        if (e.type === 'boss' && Math.max(Math.abs(S.px - e.x), Math.abs(S.py - e.y)) <= 1) break;
        const ox = e.x, oy = e.y;
        if (!stepToward(e)) break;
        if (i > 0) { e.ox = ox - (e.x - ox); e.oy = oy - (e.y - oy); }   // wolf: tween covers both cells
      }
    }
  } else if (it.type === 'rest') e.rest = Math.max(0, e.rest - 1);
  // 'stun' and 'sleep' do nothing this phase
}

// ---------- combat ----------
function chainAdvance(v, wild) {
  const c = S.chain;
  if (c.n === 0) { c.n = 1; c.mult = 1; c.kind = ''; c.vals = [v]; }
  else if (v > c.last || wild) { c.n++; c.mult += 1 + S.relic.stairs; c.kind = 'STRAIGHT'; c.vals.push(v); }
  else if (v === c.last) { c.n++; c.mult += 1 + S.relic.twins; c.kind = 'MATCH'; c.vals.push(v); }
  else { c.n = 1; c.mult = 1; c.kind = ''; c.vals = [v]; }
  c.last = v; if (c.vals.length > 6) c.vals.shift();

  const a = FX ? FX.overT : 1;
  cx.fillStyle = 'rgba(6,10,9,' + 0.8 * a + ')'; cx.fillRect(0, 0, W, H);
  cx.globalAlpha = a;
  const y = 250;
  txt('THE DIE IS CAST', W / 2, y, F(36, '900'), C.red, 'center', 5);
  const lines = wrapText(S.cause ? S.cause.charAt(0).toUpperCase() + S.cause.slice(1) : '', W - 60, F(18, '700'));
  lines.forEach((l, i) => txt(l, W / 2, y + 44 + i * 22, F(18, '700'), C.txt));
  const yy = y + 66 + lines.length * 22;
  txt('SCORE', W / 2 - 90, yy + 14, F(12), C.dim); txt(String(S.score), W / 2 - 90, yy + 44, F(34, '900'), C.txt);
  txt('BEST', W / 2 + 90, yy + 14, F(12), C.dim); txt(String(best), W / 2 + 90, yy + 44, F(34, '900'), C.gold);
  if (S.score >= best && S.score > 0) txt('NEW BEST!', W / 2, yy + 84, F(18, '900'), C.gold, 'center', 3);
  txt('floor ' + S.floor + '  ·  ' + S.kills + ' kills  ·  best hit ' + S.bestHit + '  ·  top mult ×' + S.maxMult, W / 2, yy + 114, F(13, '700'), C.dim);
  const ready = performance.now() - overAt > 400;
  cx.globalAlpha = a * (ready ? 0.75 + 0.25 * Math.sin(performance.now() / 200) : 0.4);
  txt(isTouch ? 'tap to roll again' : 'press any key to roll again', W / 2, yy + 160, F(18, '800'), C.txt);
  cx.globalAlpha = 1;
}
let SC = 1;
function render() {
  const t = S.t + (S.phase === 'pick' ? 0 : 0);
  cx.setTransform(SC, 0, 0, SC, 0, 0);
  const bg = cx.createRadialGradient(W / 2, H * 0.45, 80, W / 2, H * 0.45, H * 0.75);
  bg.addColorStop(0, '#173129'); bg.addColorStop(1, C.bg); cx.fillStyle = bg; cx.fillRect(0, 0, W, H);
  cx.save();
  if (FX.shake > 0.3) cx.translate((Math.random() - 0.5) * FX.shake, (Math.random() - 0.5) * FX.shake);
  drawBoard();
  if (S.phase === 'play' || S.phase === 'over') drawDanger(t);
  const showPrev = S.phase === 'play' && !S.over && S.lock <= 0 && !S.pendEnemy;
  if (showPrev) drawPreviews(t);
  drawActors(t);
  if (S.phase === 'play' || S.phase === 'over') drawEnemyHUD(t);
  if (showPrev) drawBumpPreview(t);
  drawFXLayer();
  cx.restore();
  if (FX.hurt > 0.02) {
    const g = cx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.7);
    g.addColorStop(0, 'rgba(255,0,40,0)'); g.addColorStop(1, 'rgba(255,0,40,' + FX.hurt * 0.5 + ')'); cx.fillStyle = g; cx.fillRect(0, 0, W, H);
  }
  drawHUD(t);
  drawPanel(t);
  if (S.phase === 'pick') drawCards(t);
  drawBanner();
  if (FX.flash > 0.02) { cx.globalAlpha = FX.flash * 0.6; cx.fillStyle = FX.flashCol; cx.fillRect(0, 0, W, H); cx.globalAlpha = 1; }
  if (S.over) drawOver();
}

// ---------- fit canvas ----------
function fit() {
  const dpr = window.devicePixelRatio || 1, s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = (W * s) + 'px'; cv.style.height = (H * s) + 'px';
  cv.style.marginTop = ((innerHeight - H * s) / 2) + 'px';
  cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr);
  SC = cv.width / W;
}
addEventListener('resize', fit); fit();

// ---------- input ----------
function actions() {
  if (S.over) return ['none'];
  if (S.phase === 'play') return ['none', 'up', 'down', 'left', 'right'];
  if (S.phase === 'pick') return ['none', 'pick1', 'pick2', 'pick3'].slice(0, 1 + (S.cards ? S.cards.length : 0));
  return ['none'];
}
function input(a) {
  if (!actions().includes(a) || a === 'none') return;
  S.buf = a;
}
function humanRestart() { if (S.over && performance.now() - overAt > 400) { reset(Date.now() & 0x7fffffff); return true; } return false; }
const KEYMAP = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };
addEventListener('keydown', e => {
  audioInit();
  if (S.over) { humanRestart(); e.preventDefault(); return; }
  const k = e.code;
  if (S.phase === 'pick') {
    if (k === 'Digit1' || k === 'Numpad1') input('pick1');
    else if (k === 'Digit2' || k === 'Numpad2') input('pick2');
    else if (k === 'Digit3' || k === 'Numpad3') input('pick3');
    else if (!e.repeat && (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'KeyA' || k === 'KeyW')) uiSel = (uiSel + 2) % 3;
    else if (!e.repeat && (k === 'ArrowRight' || k === 'ArrowDown' || k === 'KeyD' || k === 'KeyS')) uiSel = (uiSel + 1) % 3;
    else if ((k === 'Space' || k === 'Enter') && !e.repeat && S.t - S.cardT > 200) input('pick' + (uiSel + 1));
    isTouch = false; e.preventDefault(); return;
  }
  const m = KEYMAP[k];
  if (m) { if (!e.repeat) input(m); isTouch = false; e.preventDefault(); }
});
let ptr = null;
function toLogical(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audioInit();
  if (e.pointerType === 'touch') isTouch = true;
  if (S.over) { humanRestart(); ptr = null; return; }
  ptr = toLogical(e);
});
addEventListener('pointerup', e => {
  if (!ptr || S.over) { ptr = null; return; }
  const p = toLogical(e), dx = p.x - ptr.x, dy = p.y - ptr.y, start = ptr; ptr = null;
  if (S.phase === 'pick') {
    for (let i = 0; i < (S.cards ? S.cards.length : 0); i++) { const r = cardRect(i); if (start.x >= r.x && start.x <= r.x + r.w && start.y >= r.y && start.y <= r.y + r.h) { uiSel = i; input('pick' + (i + 1)); return; } }
    return;
  }
  if (S.phase !== 'play') return;
  let dir = null;
  if (Math.hypot(dx, dy) > 24) dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
  else {
    const [dcx, dcy] = cellC(S.px, S.py), tx = p.x - dcx, ty = p.y - dcy;
    if (Math.hypot(tx, ty) < 20) return;
    dir = Math.abs(tx) > Math.abs(ty) ? (tx > 0 ? 'right' : 'left') : (ty > 0 ? 'down' : 'up');
  }
  input(dir);
});

// ---------- main loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(100, now - last); last = now;
  if (!manual) { carry += dt; while (carry >= STEP) { step(); carry -= STEP; } }
  render();
  requestAnimationFrame(frame);
}

// ---------- bot API ----------
function previewMap() { const o = {}; for (const d of DLIST) o[d] = S.die.f[rollO(S.die.o, d)[0]].v; return o; }
function bumpMap() {
  const o = {}, h = predictHit();
  for (const d of DLIST) { const v = DIRS[d], e = inB(S.px + v[0], S.py + v[1]) ? enemyAt(S.px + v[0], S.py + v[1]) : null; if (!e) continue; const pin = pinnedAt(e, v[0], v[1]); o[d] = { dmg: h.dmg * (pin ? 2 : 1), pinned: pin, hp: e.hp }; }
  return o;
}
window.__game = {
  reset(seed) { manual = true; reset(seed); },
  getState() {
    const dm = dangerMap(), danger = Object.keys(dm).map(k => [k % GN, (k / GN) | 0, dm[k]]);
    return {
      t: S.t, score: S.score, over: S.over, cause: S.cause, difficulty: S.floor,
      phase: S.phase, ready: isReady(), floor: S.floor, hp: S.hp, maxHp: S.maxHp, barrier: S.barrier, N: GN,
      px: S.px, py: S.py, faces: S.die.o.map(id => ({ v: S.die.f[id].v, k: S.die.f[id].k })), preview: previewMap(),
      hit: predictHit(), bump: bumpMap(), chain: { n: S.chain.n, mult: S.chain.mult, last: S.chain.last }, momentum: S.momentum,
      relic: Object.assign({}, S.relic), dread: S.dread, dreadMax: dreadMax(), dreadSpawns: S.dreadSpawns, eliteKilled: S.eliteKilled, kills: S.kills, turns: S.turns,
      enemies: S.en.filter(e => !e.dead).map(e => ({ id: e.id, type: e.type, x: e.x, y: e.y, hp: e.hp, maxHp: e.maxHp, atk: e.atk, dormant: e.dormant,
        intent: e.int ? { type: e.int.type, kind: e.int.kind || null, cells: e.int.cells ? e.int.cells.map(c => c.slice()) : null } : null })),
      danger, cards: S.cards ? S.cards.map(c => ({ type: c.type, face: c.face, faceV: c.face >= 0 ? S.die.f[c.face].v : null })) : null, picks: S.picks,
    };
  },
  getActions() { return actions(); },
  input(a) { input(a); },
  tick(ms) { carry += ms; while (carry >= STEP) { step(); carry -= STEP; } },
  isOver() { return S.over; },
  score() { return S.score; },
  snapshot() { return structuredClone({ S, carry }); },
  restore(s) { const c = structuredClone(s); S = c.S; carry = c.carry; },
  quiet(b) { QUIET = !!b; },
  render() { render(); },
};

reset(Date.now() & 0x7fffffff);
requestAnimationFrame(frame);
})();
</script>
