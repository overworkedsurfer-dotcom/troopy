<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mazewright</title>
<meta name="description" content="Tower defence with one turret and no towers: the maze you force is your only weapon. Start a wave with walls still in hand for a greedy score multiplier.">
<style>
  html,body{margin:0;height:100%;background:#070a1c;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block;margin:0 auto}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';
const ID = 'mazewright';
const W = 480, H = 800;
const STEP = 1000 / 60;
const GN = 9, CELL = 48, BX = 24, BY = 138;
const CX = 4, CY = 4, CI = CX + CY * GN;                  // core cell
const BUILD_MS = 30000;                                    // build phase auto-starts after this
const GATES = [[4, 0], [8, 4], [4, 8], [0, 4]];           // N E S W
const GDIR = [[0, 1], [-1, 0], [0, -1], [1, 0]];          // inward direction per gate
const GNAME = ['NORTH', 'EAST', 'SOUTH', 'WEST'];
const cv = document.getElementById('c'), cx = cv.getContext('2d');
const FONT = "Inter, 'Trebuchet MS', 'Segoe UI', Verdana, sans-serif";
const F = (sz, w) => (w || '800') + ' ' + sz + 'px ' + FONT;
const C = {
  bg: '#0a0f26', bg2: '#111a3d', grid: 'rgba(90,180,255,0.10)', path: '#4de3ff', ghost: '#ffffff', core: '#ff4f8b', coreHi: '#ffd1e3',
  wallT: '#ffd9a0', wallF: '#d98a3d', wallS: '#9c5a22', fresh: '#fff1c9', red: '#ff4d6d', gold: '#ffd166', txt: '#eef3ff', dim: '#8ea0d6',
  laser: '#ff5fa2', cyan: '#4de3ff', lime: '#b8f35a', violet: '#c48bff',
};

// ---------- seeded RNG ----------
function rnd() {
  let t = (S.rng = (S.rng + 0x6D2B79F5) | 0);
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function wpick(list) { let tot = 0; for (const it of list) tot += it[1]; let r = rnd() * tot; for (const it of list) { r -= it[1]; if (r < 0) return it[0]; } return list[list.length - 1][0]; }

// ---------- best ----------
function loadBest() { try { return +localStorage.getItem('funlab.' + ID + '.best') || 0; } catch (e) { return 0; } }
function saveBest(v) { try { localStorage.setItem('funlab.' + ID + '.best', String(v)); } catch (e) {} }
let best = loadBest();

// ---------- audio ----------
let AC = null, NB = null, MASTER = null;
function audioInit() {
  try {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      MASTER = AC.createGain(); MASTER.gain.value = 0.5; MASTER.connect(AC.destination);
      const len = (AC.sampleRate * 0.6) | 0; NB = AC.createBuffer(1, len, AC.sampleRate);
      const d = NB.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { AC = null; }
}
function tone(f, d, type, v, slide, delay) {
  if (QUIET || !AC) return;
  try {
    const t = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f * slide), t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v || 0.1, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(MASTER); o.start(t); o.stop(t + d + 0.03);
  } catch (e) {}
}
function noise(d, v, freq, q, delay, ftype) {
  if (QUIET || !AC || !NB) return;
  try {
    const t = AC.currentTime + (delay || 0), s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
    s.buffer = NB; f.type = ftype || 'bandpass'; f.frequency.value = freq || 1000; f.Q.value = q || 1;
    g.gain.setValueAtTime(v || 0.1, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    s.connect(f); f.connect(g); g.connect(MASTER); s.start(t, Math.random() * 0.4); s.stop(t + d + 0.03);
  } catch (e) {}
}
let lastZap = 0;
const SND = {
  move() { tone(620, 0.025, 'triangle', 0.025); },
  place() { tone(140, 0.09, 'square', 0.09, 0.5); noise(0.07, 0.25, 900, 1.2); tone(420, 0.05, 'triangle', 0.05, null, 0.03); },
  undo() { tone(300, 0.08, 'triangle', 0.06, 1.6); },
  bad() { tone(110, 0.14, 'sawtooth', 0.07); tone(104, 0.14, 'sawtooth', 0.06); },
  zap(p) { if (QUIET || !AC) return; const n = AC.currentTime; if (n - lastZap < 0.035) return; lastZap = n; tone(1400 + p * 300, 0.07, 'sawtooth', 0.035, 0.25); },
  pop(c) { const f = 330 * Math.pow(2, Math.min(18, c) / 12); tone(f, 0.07, 'square', 0.05); tone(f * 1.5, 0.1, 'triangle', 0.05, null, 0.03); noise(0.1, 0.18, 2600, 0.8); },
  leak() { tone(90, 0.35, 'sawtooth', 0.18, 0.5); noise(0.3, 0.4, 300, 0.7); tone(880, 0.12, 'square', 0.06, null, 0.05); tone(660, 0.12, 'square', 0.06, null, 0.2); },
  start() { tone(220, 0.18, 'sawtooth', 0.07, 2); tone(330, 0.25, 'square', 0.06, 2, 0.08); noise(0.3, 0.1, 4000, 0.5, 0.1); },
  pulse() { tone(70, 0.6, 'sine', 0.35, 0.4); tone(1200, 0.3, 'sawtooth', 0.06, 0.2); noise(0.5, 0.35, 500, 0.6, 0, 'lowpass'); },
  tally(i) { tone(700 + i * 90, 0.05, 'square', 0.04); },
  clear() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.16, 'triangle', 0.08, null, i * 0.07)); },
  pick() { tone(784, 0.1, 'triangle', 0.09); tone(1175, 0.22, 'triangle', 0.08, null, 0.07); },
  sel() { tone(500, 0.03, 'triangle', 0.04); },
  boss() { tone(55, 0.8, 'sawtooth', 0.12, 1.3); tone(82, 0.8, 'sawtooth', 0.08, 1.3); },
  die() { tone(300, 1.1, 'sawtooth', 0.15, 0.15); noise(0.9, 0.45, 260, 0.5); },
  crit() { tone(1800, 0.06, 'square', 0.04); },
};

// ---------- tables ----------
const D4 = [[0, -1], [1, 0], [0, 1], [-1, 0]];
const ET = {
  runner: { name: 'Runner', a: 'a', hp: 10, spd: 3.0, dmg: 1, val: 10, col: '#b8f35a', r: 0.27 },
  tank:   { name: 'Tank', a: 'a', hp: 30, spd: 2.0, dmg: 2, val: 25, col: '#ffbe3d', r: 0.34 },
  swift:  { name: 'Swift', a: 'a', hp: 6, spd: 4.6, dmg: 1, val: 14, col: '#5ee7ff', r: 0.23 },
  flyer:  { name: 'Flyer', a: 'a', hp: 9, spd: 2.8, dmg: 1, val: 18, col: '#c48bff', r: 0.26, fly: true },
  boss:   { name: 'Behemoth', a: 'the', hp: 120, spd: 1.25, dmg: 6, val: 250, col: '#ff4d6d', r: 0.44 },
};
const UP = {
  dmg:    { name: 'Hot Laser', w: 3 },
  rate:   { name: 'Overclock', w: 3 },
  range:  { name: 'Long Lens', w: 2 },
  pierce: { name: 'Piercer', w: 1.6 },
  splash: { name: 'Shrapnel', w: 1.4 },
  slow:   { name: 'Cryo Coil', w: 1.3 },
  crit:   { name: 'Lucky Optics', w: 1.4 },
  twin:   { name: 'Twin Barrel', w: 1.1 },
  walls:  { name: 'Brickworks', w: 1.6 },
  repair: { name: 'Patch Core', w: 1.8 },
  cap:    { name: 'Capacitor', w: 1.2 },
  bounty: { name: 'Bounty', w: 1.1 },
  glass:  { name: 'Glass Core', w: 0.8 },
};

// ---------- state ----------
let S = null, FX = null;
let QUIET = false, manual = false, carry = 0, overAt = 0, isTouch = false;

function newState(seed) {
  return {
    rng: (seed | 0) || 1, t: 0, score: 0, over: false, cause: null, phase: 'build', wave: 1,
    coreHp: 20, coreMax: 20, walls: new Array(GN * GN).fill(0), wallsLeft: 3, wallsPer: 3, cur: [4, 2], gates: [0],
    dist: null, lenF: [1, 1, 1, 1],
    tur: { dmg: 5, rate: 2.5, range: 3.5, pierce: 0, splash: 0, slow: 0, crit: 0, twin: 0, cd: 0, ang: -Math.PI / 2, glass: 0, bounty: 0 },
    pulse: 1, pulseMax: 1, pulseMul: 6, en: [], nid: 1, spawnQ: [], waveT: 0, bank: 1, combo: 0, comboT: 0,
    wk: 0, wl: 0, ws: 0, wsBank: 1, lastLeak: '', lock: 0, freeze: 0, buf: null, cards: null, sel: 0, cardT: 0, tallyT: 0, perfect: 0,
    kills: 0, leaks: 0, bestCombo: 0, placedT: {}, flyWave: false, buildT: 0,
  };
}
function newFX() {
  return { parts: [], texts: [], rings: [], beams: [], shake: 0, flash: 0, flashCol: '#fff', banner: null, hit: {}, corpses: [],
    disp: 0, coreFlash: 0, kick: 0, hintA: 1, acts: 0, squash: {}, comboPulse: 0, overT: 0, pulseRing: 0, muzzle: 0 };
}
function reset(seed) {
  S = newState(seed); FX = newFX(); carry = 0;
  S.gates = chooseGates(1); S.dist = computeDist(S.walls); planWave();
  FX.banner = { txt: 'WAVE 1', sub: 'place walls to lengthen the path', life: 1, col: C.gold };
}

// ---------- grid logic ----------
const inB = (x, y) => x >= 0 && y >= 0 && x < GN && y < GN;
const isGate = i => GATES.some(g => g[0] + g[1] * GN === i);
function computeDist(walls) {
  const d = new Array(GN * GN).fill(999); d[CI] = 0; const q = [CI]; let h = 0;
  while (h < q.length) {
    const c = q[h++], x = c % GN, y = (c / GN) | 0;
    for (const [dx, dy] of D4) {
      const nx = x + dx, ny = y + dy; if (!inB(nx, ny)) continue;
      const ni = nx + ny * GN; if (walls[ni] || d[ni] < 999) continue;
      d[ni] = d[c] + 1; q.push(ni);
    }
  }
  return d;
}
function canPlace(i) {
  if (i === CI || isGate(i) || S.walls[i]) return false;
  S.walls[i] = 1; const d = computeDist(S.walls); S.walls[i] = 0;
  return GATES.every(g => d[g[0] + g[1] * GN] < 999);
}
// next cell along the distance field (same rule as enemies use)
function nextCell(dist, x, y, dir) {
  const here = dist[x + y * GN];
  let bestC = null;
  if (dir) { const nx = x + dir[0], ny = y + dir[1]; if (inB(nx, ny) && dist[nx + ny * GN] === here - 1) return [nx, ny, dir]; }
  for (const d of D4) { const nx = x + d[0], ny = y + d[1]; if (inB(nx, ny) && dist[nx + ny * GN] === here - 1) { bestC = [nx, ny, d]; break; } }
  return bestC;
}
function tracePath(dist, gi) {
  const g = GATES[gi]; let x = g[0], y = g[1], dir = GDIR[gi]; const pts = [[x, y]];
  for (let k = 0; k < 100 && !(x === CX && y === CY); k++) { const n = nextCell(dist, x, y, dir); if (!n) break; x = n[0]; y = n[1]; dir = n[2]; pts.push([x, y]); }
  return pts;
}
const gateCount = w => w < 3 ? 1 : w < 6 ? 2 : w < 10 ? 3 : 4;
function chooseGates(w) {
  const n = gateCount(w);
  const all = [0, 1, 2, 3];
  for (let i = 3; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const t = all[i]; all[i] = all[j]; all[j] = t; }
  return all.slice(0, n).sort();
}
function hpMul(w) { return Math.pow(1.2, w - 1) * (w > 10 ? Math.pow(1.12, w - 10) : 1); }   // steeper after wave 10: the hard ceiling
function spdMul(w) { return Math.min(1.6, 1 + 0.035 * (w - 1)); }

// ---------- waves ----------
function startWave() {
  S.bank = 1 + Math.min(4, S.wallsLeft); S.wsBank = S.bank;          // walls still in hand bank a multiplier (and stay in hand)
  if (!QUIET) {
    FX.banner = { txt: 'WAVE ' + S.wave, sub: S.bank > 1 ? 'GREED BANK ×' + S.bank + ' on every kill' : 'defend the core', life: 1, col: S.bank > 1 ? C.gold : C.txt };
    SND.start(); FX.flash = 0.2; FX.flashCol = '#4de3ff';
    if (S.bank > 1) { const [x, y] = cc(CX, CY); ftext(x, y - 50, 'BANK ×' + S.bank, C.gold, 26, { dec: 0.012 }); }
  }
  for (let i = 0; i < S.walls.length; i++) if (S.walls[i] === 2) S.walls[i] = 1;
  S.dist = computeDist(S.walls);
  S.lenF = GATES.map(g => Math.round(S.dist[g[0] + g[1] * GN] / 4 * 10) / 10);
  S.phase = 'wave'; S.waveT = 0; S.wk = 0; S.wl = 0; S.ws = 0; S.combo = 0; S.comboT = 0;
  if (S.spawnQ.some(q => q.type === 'boss') && !QUIET) SND.boss();
  S.pulse = S.pulseMax;
}
function planWave() {
  const w = S.wave, n = Math.min(26, 6 + w), iv = Math.max(200, 520 - 16 * w);
  const pool = [['runner', 5]];
  if (w >= 4) pool.push(['tank', 1.2 + w * 0.12]);
  if (w >= 3) pool.push(['swift', 1.8]);
  if (w >= 7) pool.push(['flyer', 1.2 + w * 0.12]);
  S.spawnQ = [];
  for (let k = 0; k < n; k++) S.spawnQ.push({ type: wpick(pool), gate: S.gates[Math.floor(rnd() * S.gates.length)], at: k * iv });
  if (w % 5 === 0) { const nb = 1 + Math.floor(w / 15); for (let b = 0; b < nb; b++) S.spawnQ.push({ type: 'boss', gate: S.gates[b % S.gates.length], at: n * iv * 0.5 + b * 900 }); S.spawnQ.sort((a, b) => a.at - b.at); }
}
function spawn(q) {
  const b = ET[q.type], g = GATES[q.gate], w = S.wave;
  const hp = Math.round(b.hp * hpMul(w) * (q.type === 'boss' ? 1 + 0.1 * Math.floor(w / 5) : 1));
  const e = { id: S.nid++, type: q.type, gate: q.gate, x: g[0] + 0.5 - GDIR[q.gate][0] * 0.6, y: g[1] + 0.5 - GDIR[q.gate][1] * 0.6, cx: g[0], cy: g[1], tx: g[0], ty: g[1],
    dir: GDIR[q.gate].slice(), hp, maxHp: hp, spd: b.spd * spdMul(w), dmg: b.dmg, fly: !!b.fly, slowT: 0, st: S.t };
  S.en.push(e);
}
function remaining(e) {
  if (e.fly) return Math.hypot(CX + 0.5 - e.x, CY + 0.5 - e.y);
  return S.dist[e.tx + e.ty * GN] + Math.hypot(e.tx + 0.5 - e.x, e.ty + 0.5 - e.y);
}
function moveEnemy(e, dt) {
  let sp = e.spd * (e.slowT > 0 ? 1 - S.tur.slow : 1) * dt;
  if (e.slowT > 0) e.slowT -= dt * 1000;
  for (let guard = 0; sp > 1e-6 && guard < 8; guard++) {
    if (e.fly) {
      const dx = CX + 0.5 - e.x, dy = CY + 0.5 - e.y, d = Math.hypot(dx, dy);
      if (d <= sp + 0.35) { leak(e); return; }
      e.x += dx / d * sp; e.y += dy / d * sp; e.cx = Math.floor(e.x); e.cy = Math.floor(e.y); return;
    }
    const dx = e.tx + 0.5 - e.x, dy = e.ty + 0.5 - e.y, d = Math.hypot(dx, dy);
    if (d <= sp) {
      e.x = e.tx + 0.5; e.y = e.ty + 0.5; sp -= d; e.cx = e.tx; e.cy = e.ty;
      if (e.cx === CX && e.cy === CY) { leak(e); return; }
      const n = nextCell(S.dist, e.cx, e.cy, e.dir);
      if (!n) { leak(e); return; }
      e.tx = n[0]; e.ty = n[1]; e.dir = n[2].slice();
    } else { e.x += dx / d * sp; e.y += dy / d * sp; sp = 0; }
  }
}
function leak(e) {
  if (e.dead) return;
  e.dead = true; S.wl++; S.leaks++; S.coreHp -= e.dmg; S.lastLeak = e.type; S.combo = 0; S.comboT = 0;
  S.freeze = Math.max(S.freeze, 70);
  if (!QUIET) {
    const [x, y] = cc(CX, CY);
    FX.coreFlash = 1; shake(10 + e.dmg * 2); FX.flash = 0.35; FX.flashCol = '#ff2850'; SND.leak();
    burst(x, y, 30, C.red, 5); ring(x, y, C.red, 70, 6); ftext(x, y - 40, '-' + e.dmg + ' CORE', C.red, 22);
  }
  if (S.coreHp <= 0) {
    S.coreHp = 0;
    const b = ET[e.type];
    die((b.a === 'the' ? 'the ' : 'a ') + b.name + ' broke the core on wave ' + S.wave + (S.wl > 1 ? ' (' + S.wl + ' leaks this wave)' : ''));
  }
}
function die(cause) {
  S.over = true; S.cause = cause; S.phase = 'over';
  if (!QUIET) {
    const [x, y] = cc(CX, CY);
    burst(x, y, 80, C.core, 7, { dec: 0.01, sz: 4 }); burst(x, y, 40, '#fff', 6); ring(x, y, C.core, 200, 10);
    shake(26); FX.flash = 0.9; FX.flashCol = '#fff'; SND.die(); FX.overT = 0;
    if (S.score > best) { best = S.score; saveBest(best); }
  }
  overAt = performance.now();
}
function hitEnemy(e, dmg, crit) {
  if (e.dead) return;
  e.hp -= dmg;
  if (!QUIET) { FX.hit[e.id] = 1; if (crit) { ftext(e.x * CELL + BX, e.y * CELL + BY - 18, 'CRIT', C.gold, 14); SND.crit(); } }
  if (S.tur.slow) e.slowT = 1200;
  if (e.hp <= 0) kill(e);
}
function kill(e) {
  e.dead = true; S.kills++; S.wk++;
  S.combo = S.comboT > 0 ? S.combo + 1 : 1; S.comboT = 1300; S.bestCombo = Math.max(S.bestCombo, S.combo);
  const b = ET[e.type], lf = e.fly ? 1 : Math.max(1, S.lenF[e.gate]);
  const cm = 1 + 0.25 * (S.combo - 1);
  const pts = Math.round(b.val * (1 + 0.15 * (S.wave - 1)) * lf * S.bank * cm * (1 + S.tur.bounty * 0.4));
  S.score += pts; S.ws += pts;
  if (e.type === 'boss') S.freeze = Math.max(S.freeze, 160);
  else if (S.combo >= 5 && S.combo % 5 === 0) S.freeze = Math.max(S.freeze, 50);
  if (!QUIET) {
    const x = BX + e.x * CELL, y = BY + e.y * CELL;
    FX.corpses.push({ type: e.type, x, y, life: 1, ang: Math.atan2(e.dir ? e.dir[1] : 1, e.dir ? e.dir[0] : 0) });
    burst(x, y, e.type === 'boss' ? 60 : 16, b.col, e.type === 'boss' ? 7 : 4); burst(x, y, 6, '#fff', 5, { sz: 2 });
    ring(x, y, b.col, e.type === 'boss' ? 90 : 34, 3);
    ftext(x, y - 14, '+' + pts, S.combo >= 4 ? C.gold : '#fff', Math.min(26, 13 + Math.log2(pts + 1) * 1.3), { vy: -1 });
    if (S.combo >= 3) { FX.comboPulse = 1; if (S.combo % 3 === 0) ftext(W / 2, BY + 20, 'COMBO ×' + cm.toFixed(2).replace(/\.?0+$/, ''), C.gold, 18, { dec: 0.02 }); }
    SND.pop(S.combo);
    if (e.type === 'boss') { shake(18); FX.flash = 0.5; FX.flashCol = '#ffd1e3'; FX.banner = { txt: 'BEHEMOTH DOWN', sub: '+' + pts, life: 1, col: C.gold }; }
    else shake(2);
  }
}
function fire() {
  const T = S.tur, R2 = T.range;
  const inR = S.en.filter(e => !e.dead && Math.hypot(e.x - CX - 0.5, e.y - CY - 0.5) <= R2);
  if (!inR.length) { T.cd = 0; return; }
  inR.sort((a, b) => remaining(a) - remaining(b));
  const tg = inR[0];
  T.cd += 1000 / T.rate; if (T.cd < 0) T.cd = 0;
  const ox = CX + 0.5, oy = CY + 0.5, ang = Math.atan2(tg.y - oy, tg.x - ox); T.ang = ang;
  const ux = Math.cos(ang), uy = Math.sin(ang);
  const base = T.dmg * (T.glass ? 1.8 : 1);
  const crit = T.crit > 0 && rnd() < T.crit;
  const dmg = base * (crit ? 3 : 1);
  // pierce: everything close to the ray
  let hits = [tg];
  if (T.pierce) {
    const others = inR.filter(e => e !== tg).map(e => { const vx = e.x - ox, vy = e.y - oy, al = vx * ux + vy * uy, pp = Math.abs(vx * uy - vy * ux); return { e, al, pp }; })
      .filter(o => o.al > 0 && o.pp < 0.5).sort((a, b) => a.al - b.al).slice(0, T.pierce).map(o => o.e);
    hits = hits.concat(others);
  }
  let far = Math.hypot(tg.x - ox, tg.y - oy); for (const h of hits) far = Math.max(far, Math.hypot(h.x - ox, h.y - oy));
  if (!QUIET) { FX.beams.push({ x0: BX + (ox + ux * 0.42) * CELL, y0: BY + (oy + uy * 0.42) * CELL, x1: BX + (ox + ux * (T.pierce ? Math.max(far, R2) : far)) * CELL, y1: BY + (oy + uy * (T.pierce ? Math.max(far, R2) : far)) * CELL, life: 1, w: crit ? 7 : 4.5, col: crit ? C.gold : C.laser }); FX.kick = 1; FX.muzzle = 1; SND.zap(T.pierce); }

  cx.fillStyle = 'rgba(5,8,22,' + 0.75 * p + ')'; cx.fillRect(BX - 10, BY - 10, GN * CELL + 20, GN * CELL + 20);
  txt('PICK AN UPGRADE', W / 2, BY + 30, F(20, '900'), C.gold, 'center', 4);
  txt('wave ' + S.wave + ' cleared', W / 2, BY + 52, F(12, '700'), C.dim);
  for (let i = 0; i < S.cards.length; i++) {
    const k = S.cards[i], r = cardRect(i), q = easeOut(clamp01(p * 1.4 - i * 0.15)), sel = i === S.sel;
    cx.save(); cx.translate(0, (1 - q) * 50 - (sel ? 8 : 0)); cx.globalAlpha = q;
    rr(r.x, r.y, r.w, r.h, 14); cx.fillStyle = sel ? '#22306a' : '#161f4a'; cx.fill();
    cx.lineWidth = sel ? 4 : 2; cx.strokeStyle = sel ? C.gold : 'rgba(77,227,255,0.5)'; cx.stroke();
    cardIcon(k, r.x + r.w / 2, r.y + 56, t);
    txt(UP[k].name, r.x + r.w / 2, r.y + 112, F(16, '900'), sel ? C.gold : C.txt);
    const [d1, d2] = cardInfo(k);
    wrapText(d1, r.w - 18, F(13, '700')).slice(0, 3).forEach((ln, j) => txt(ln, r.x + r.w / 2, r.y + 140 + j * 17, F(13, '700'), C.txt));
    wrapText(d2, r.w - 14, F(12, '900')).slice(0, 2).forEach((ln, j) => txt(ln, r.x + r.w / 2, r.y + 208 + j * 16, F(12, '900'), k === 'glass' ? C.red : C.cyan));
    txt(String(i + 1), r.x + 14, r.y + 16, F(12, '900'), C.dim);
    cx.restore();
  }
  txt(isTouch ? 'tap a card' : '← → then Space, or 1 / 2 / 3', W / 2, BY + 350, F(13, '700'), C.dim, 'center', 3);
}
function drawTally(t) {
  const p = clamp01((S.t - S.tallyT) / 1400);
  cx.fillStyle = 'rgba(5,8,22,' + Math.min(0.7, p * 3) + ')'; cx.fillRect(BX - 10, BY - 10, GN * CELL + 20, GN * CELL + 20);
  const y0 = BY + 120;
  txt('WAVE ' + S.wave + ' CLEAR', W / 2, y0, F(30, '900'), C.gold, 'center', 5);
  const rows = [['kills', S.wk], ['leaks', S.wl], ['bank', '×' + S.wsBank], ['wave points', S.ws], [S.perfect ? 'PERFECT bonus' : 'no perfect bonus', S.perfect]];
  rows.forEach((r, i) => {
    const q = clamp01(p * 2.2 - i * 0.25); if (q <= 0) return;
    const v = typeof r[1] === 'number' ? Math.round(r[1] * easeOut(q)) : r[1];
    cx.globalAlpha = q;
    txt(r[0], W / 2 - 110, y0 + 50 + i * 30, F(16, '700'), r[0] === 'leaks' && S.wl ? C.red : C.dim, 'left');
    txt(String(v), W / 2 + 110, y0 + 50 + i * 30, F(18, '900'), r[0].startsWith('PERFECT') ? C.gold : C.txt, 'right');
    cx.globalAlpha = 1;
  });
}
function drawBanner() {
  const b = FX.banner; if (!b) return;
  const a = b.life > 0.85 ? (1 - b.life) / 0.15 : b.life < 0.25 ? b.life / 0.25 : 1;
  const sc = b.life > 0.85 ? 0.6 + 0.4 * easeOut((1 - b.life) / 0.15) : 1;
  cx.save(); cx.globalAlpha = a; cx.translate(W / 2, BY + 70); cx.scale(sc, sc);
  cx.fillStyle = 'rgba(5,8,22,0.75)'; rr(-200, -30, 400, b.sub ? 66 : 50, 12); cx.fill();
  txt(b.txt, 0, -6, F(28, '900'), b.col || C.txt, 'center', 4);
  if (b.sub) txt(b.sub, 0, 22, F(13, '700'), C.txt, 'center', 3);
  cx.restore(); cx.globalAlpha = 1;
}
function drawOver() {
  const a = FX.overT;
  cx.fillStyle = 'rgba(4,6,18,' + 0.82 * a + ')'; cx.fillRect(0, 0, W, H);
  cx.globalAlpha = a;
  const y = 250;
  txt('CORE BREACHED', W / 2, y, F(36, '900'), C.red, 'center', 5);
  const lines = wrapText(S.cause ? S.cause.charAt(0).toUpperCase() + S.cause.slice(1) : '', W - 60, F(17, '700'));
  lines.forEach((l, i) => txt(l, W / 2, y + 44 + i * 22, F(17, '700'), C.txt));
  const yy = y + 66 + lines.length * 22;
  txt('SCORE', W / 2 - 90, yy + 14, F(12), C.dim); txt(String(S.score), W / 2 - 90, yy + 44, F(32, '900'), C.txt);
  txt('BEST', W / 2 + 90, yy + 14, F(12), C.dim); txt(String(best), W / 2 + 90, yy + 44, F(32, '900'), C.gold);
  if (S.score >= best && S.score > 0) txt('NEW BEST!', W / 2, yy + 84, F(18, '900'), C.gold, 'center', 3);
  txt('wave ' + S.wave + '  ·  ' + S.kills + ' kills  ·  ' + S.walls.filter(v => v).length + ' walls  ·  best combo ' + S.bestCombo, W / 2, yy + 114, F(13, '700'), C.dim);
  const ready = performance.now() - overAt > 400;
  cx.globalAlpha = a * (ready ? 0.75 + 0.25 * Math.sin(performance.now() / 200) : 0.4);
  txt(isTouch ? 'tap to build again' : 'press any key to build again', W / 2, yy + 160, F(18, '800'), C.txt);
  cx.globalAlpha = 1;
}
let SC = 1;
function render() {
  const t = S.t;
  cx.setTransform(SC, 0, 0, SC, 0, 0);
  const bg = cx.createRadialGradient(W / 2, H * 0.45, 60, W / 2, H * 0.45, H * 0.75);
  bg.addColorStop(0, '#141c47'); bg.addColorStop(1, '#070a1c'); cx.fillStyle = bg; cx.fillRect(0, 0, W, H);
  cx.save();
  if (FX.shake > 0.3) cx.translate((Math.random() - 0.5) * FX.shake, (Math.random() - 0.5) * FX.shake);
  drawScene(t);
  drawFXLayer();
  cx.restore();
  if (FX.coreFlash > 0.05) {
    const g = cx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.7);
    g.addColorStop(0, 'rgba(255,0,40,0)'); g.addColorStop(1, 'rgba(255,0,40,' + FX.coreFlash * 0.45 + ')'); cx.fillStyle = g; cx.fillRect(0, 0, W, H);
  }
  drawHUD(t); drawPanel(t);
  if (S.phase === 'tally') drawTally(t);
  if (S.phase === 'pick') drawCards(t);
  drawBanner();
  if (FX.flash > 0.02) { cx.globalAlpha = FX.flash * 0.55; cx.fillStyle = FX.flashCol; cx.fillRect(0, 0, W, H); cx.globalAlpha = 1; }
  if (S.over) drawOver();
}

// ---------- fit ----------
function fit() {
  const dpr = window.devicePixelRatio || 1, s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = (W * s) + 'px'; cv.style.height = (H * s) + 'px';
  cv.style.marginTop = ((innerHeight - H * s) / 2) + 'px';
  cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr);
  SC = cv.width / W;
}
addEventListener('resize', fit); fit();

// ---------- input ----------
function actions() {
  if (S.over) return ['none'];
  if (S.phase === 'build' || S.phase === 'wave') return ['none', 'up', 'down', 'left', 'right', 'place'];
  if (S.phase === 'pick') return ['none', 'left', 'right', 'place'];
  return ['none'];
}
function input(a) {
  if (!actions().includes(a) || a === 'none') return;
  if (S.lock > 0 || S.freeze > 0) { S.buf = a; return; }
  act(a);
}
function humanRestart() { if (S.over && performance.now() - overAt > 400) { reset(Date.now() & 0x7fffffff); return true; } return false; }
const KEYMAP = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', Space: 'place' };
addEventListener('keydown', e => {
  audioInit();
  if (S.over) { humanRestart(); e.preventDefault(); return; }
  const k = e.code;
  isTouch = false;
  if (S.phase === 'pick' && S.cards) {
    const n = k === 'Digit1' ? 0 : k === 'Digit2' ? 1 : k === 'Digit3' ? 2 : -1;
    if (n >= 0 && n < S.cards.length && S.lock <= 0) { S.sel = n; input('place'); e.preventDefault(); return; }
    if (k === 'ArrowUp' || k === 'KeyW') { input('left'); e.preventDefault(); return; }
    if (k === 'ArrowDown' || k === 'KeyS') { input('right'); e.preventDefault(); return; }
    if ((k === 'Space' || k === 'Enter') && (e.repeat || S.t - S.cardT < 250)) { e.preventDefault(); return; }
    if (k === 'Enter') { input('place'); e.preventDefault(); return; }
  }
  if (S.phase === 'build' && k === 'Enter') { S.cur = [CX, CY]; input('place'); e.preventDefault(); return; }
  if (S.phase === 'wave' && k === 'Enter') { input('place'); e.preventDefault(); return; }
  if (S.phase === 'build' && (k === 'KeyZ' || k === 'Backspace')) {
    let li = -1, lt = -1; for (const kk in S.placedT) { const i = +kk; if (S.walls[i] === 2 && S.placedT[kk] > lt) { lt = S.placedT[kk]; li = i; } }
    if (li >= 0) { S.cur = [li % GN, (li / GN) | 0]; input('place'); }
    e.preventDefault(); return;
  }
  const m = KEYMAP[k];
  if (m) { if (m === 'place' && e.repeat) { e.preventDefault(); return; } input(m); e.preventDefault(); }
});
function toLogical(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
function cellAt(p) { const x = Math.floor((p.x - BX) / CELL), y = Math.floor((p.y - BY) / CELL); return inB(x, y) ? [x, y] : null; }
cv.addEventListener('pointermove', e => {
  if (e.pointerType === 'touch' || S.over) return;
  const c = cellAt(toLogical(e)); if (c && (S.phase === 'build' || S.phase === 'wave') && (c[0] !== S.cur[0] || c[1] !== S.cur[1])) S.cur = c;
});
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audioInit();
  if (e.pointerType === 'touch') isTouch = true;
  if (S.over) { humanRestart(); return; }
  const p = toLogical(e);
  if (S.phase === 'pick' && S.cards) {
    for (let i = 0; i < S.cards.length; i++) { const r = cardRect(i); if (p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h) { if (S.t - S.cardT > 250) { S.sel = i; input('place'); } return; } }
    return;
  }
  const c = cellAt(p);
  if (!c) return;
  if (S.phase === 'wave') { if (c[0] === CX && c[1] === CY) input('place'); else S.cur = c; return; }
  if (S.phase === 'build') { S.cur = c; input('place'); }
});

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(100, now - last); last = now;
  if (!manual) { carry += dt; while (carry >= STEP) { step(); carry -= STEP; } }
  render();
  requestAnimationFrame(frame);
}

// ---------- bot API ----------
window.__game = {
  reset(seed) { manual = true; reset(seed); },
  getState() {
    return {
      t: S.t, score: S.score, over: S.over, cause: S.cause, difficulty: S.wave, phase: S.phase, wave: S.wave, N: GN, core: [CX, CY],
      coreHp: S.coreHp, coreMax: S.coreMax, walls: S.walls.slice(), wallsLeft: S.wallsLeft, wallsPer: S.wallsPer, cur: S.cur.slice(),
      gates: S.gates.map(g => GATES[g].slice()), gateIdx: S.gates.slice(), allGates: GATES.map(g => g.slice()), dist: S.dist.slice(),
      tur: Object.assign({}, S.tur), pulse: S.pulse, pulseMax: S.pulseMax, bank: S.bank, combo: S.combo, lock: S.lock,
      enemies: S.en.filter(e => !e.dead).map(e => ({ id: e.id, type: e.type, x: e.x, y: e.y, hp: e.hp, maxHp: e.maxHp, fly: e.fly, dmg: e.dmg, rem: remaining(e) })),
      pending: S.spawnQ.length, cards: S.cards ? S.cards.slice() : null, sel: S.sel, kills: S.kills, leaks: S.leaks,
    };
  },
  getActions() { return actions(); },
  input(a) { input(a); },
  tick(ms) { carry += ms; while (carry >= STEP) { step(); carry -= STEP; } },
  isOver() { return S.over; },
  score() { return S.score; },
  snapshot() { return structuredClone({ S, carry }); },
  restore(s) { const c = structuredClone(s); S = c.S; carry = c.carry; },
  quiet(b) { QUIET = !!b; },
  render() { render(); },
};

reset(Date.now() & 0x7fffffff);
requestAnimationFrame(frame);
})();
</script>
