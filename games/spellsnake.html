const DICT = new Set();
for (const L in DICT_SRC) { const s = DICT_SRC[L], n = +L; for (let i = 0; i < s.length; i += n) DICT.add(s.substr(i, n)); }
let PREFIX = null;
function prefixSet() { if (!PREFIX) { PREFIX = new Set(); for (const w of DICT) for (let k = 1; k < w.length; k++) PREFIX.add(w.slice(0, k)); } return PREFIX; }
function wordValue(w) { let b = 0; for (const c of w) b += VAL[c] || 0; return b * 10 * (LENMULT[w.length] || 0); }

// ---------- tuning (escalation + hard ceiling) ----------
const WARM_MS = 20000;   // the first 20 s start slower (245 ms/cell) and ease into the level-1 pace
function interval(L, t) { const warm = t == null ? 0 : Math.max(0, 1 - t / WARM_MS); return Math.round(Math.max(78, 190 * Math.pow(0.92, L - 1)) + 55 * warm); }
function iv() { return interval(S.level, S.t); }
function rockEvery(L) { return Math.max(2400, 13000 - 900 * (L - 1)); }
function rocksPerCast(L) { return 1 + Math.floor((L - 1) / 3); }
function graceMs() { return Math.max(140, iv()); }   // one full beat to turn away
function hungerAt(L) { return Math.max(6000, 16000 - 1000 * (L - 1)); }   // ms without a cast before the tail grows
const STARVE_EVERY = 2500;

// ---------- seeded RNG (state lives in S.rng) ----------
function rnd() {
  let t = (S.rng = (S.rng + 0x6D2B79F5) | 0);
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

// ---------- best score ----------
function loadBest() { try { return +localStorage.getItem('funlab.' + ID + '.best') || 0; } catch (e) { return 0; } }
function saveBest(v) { try { localStorage.setItem('funlab.' + ID + '.best', String(v)); } catch (e) {} }
let best = loadBest();

function spitSpot(tp) {

function blast(n, h) {

function die(cause) {

function rr(x, y, w, h, r) { cx.beginPath(); cx.moveTo(x + r, y); cx.arcTo(x + w, y, x + w, y + h, r); cx.arcTo(x + w, y + h, x, y + h, r); cx.arcTo(x, y + h, x, y, r); cx.arcTo(x, y, x + w, y, r); cx.closePath(); }

  else if (kind === 'word') { top = '#fff3b0'; bot = '#ffc233'; ink = '#4a2600'; edge = '#c98500'; }

function pathPoint(path, f) {

function drawSnake() {

}

function drawBoard() {

  cx.fillStyle = '#21173a'; rr(BX - 2, BY - 2, BWID + 4, BHEI + 4, 8); cx.fill();

function render() {

  }
  if (FX.banner) {
    const b = FX.banner, k = 1 + Math.max(0, b.life - 0.85) * 3;
    cx.globalAlpha = Math.min(1, b.life * 3);
    const by = BY + BHEI - 44;
    cx.fillStyle = 'rgba(15,8,30,0.6)'; cx.fillRect(BX, by - 28, BWID, 60);
    cx.font = '900 ' + Math.round(30 * k) + 'px ' + FONT; cx.fillStyle = b.col; cx.fillText(b.txt, W / 2, by - 6);
    cx.font = '600 14px ' + FONT; cx.fillStyle = '#d7cdf5'; cx.fillText(b.sub, W / 2, by + 18);
    cx.globalAlpha = 1;
  }
  cx.restore();
  drawHUD();
  if (FX.flash > 0.02) { cx.fillStyle = 'rgba(' + FX.flashCol + ',' + FX.flash * 0.45 + ')'; cx.fillRect(0, 0, W, H); }
  if (!S.started && !S.over) drawReady();
  if (S.over) drawOver();
}

function drawHUD() {
  cx.save(); cx.translate(0, TOP);
  cx.textBaseline = 'alphabetic';
  cx.textAlign = 'left'; cx.fillStyle = '#a597d6'; cx.font = '700 13px ' + FONT; cx.fillText('SCORE', 20, 22);
  cx.fillStyle = FX.scorePulse > 0.3 ? '#fff2a8' : '#ffffff'; cx.font = '900 ' + Math.round(30 + FX.scorePulse * 8) + 'px ' + FONT; cx.fillText(String(Math.round(FX.disp)), 18, 54);
  cx.textAlign = 'right'; cx.fillStyle = '#a597d6'; cx.font = '700 13px ' + FONT; cx.fillText('BEST', W - 20, 22);
  cx.fillStyle = '#ffd34d'; cx.font = '900 24px ' + FONT; cx.fillText(String(Math.max(best, S.score)), W - 18, 52);
  cx.textAlign = 'center'; cx.fillStyle = '#a597d6'; cx.font = '700 13px ' + FONT;
  cx.fillText('LEVEL ' + S.level, W / 2, 22);
  cx.font = '900 18px ' + FONT;
  if (S.streak > 0) { cx.fillStyle = '#7ff0c8'; cx.fillText('COMBO ×' + (Math.round((1 + 0.25 * S.streak) * 100) / 100), W / 2, 50); }
  else { cx.fillStyle = '#6f62a0'; cx.fillText('COMBO ×1', W / 2, 50); }
  cx.restore();
  drawWordBar();
  // message / hint below the board
  cx.textAlign = 'center'; cx.textBaseline = 'middle';
  const yb = BY + BHEI + 30;
  if (FX.msg) { cx.globalAlpha = Math.min(1, FX.msg.life * 3); cx.fillStyle = FX.msg.col; cx.font = '900 20px ' + FONT; cx.fillText(FX.msg.txt, W / 2, yb); cx.globalAlpha = 1; }
  else {
    cx.globalAlpha = 0.45 + 0.55 * FX.hintA; cx.fillStyle = '#d8cdfa'; cx.font = '700 16px ' + FONT;
    cx.fillText(touchUI ? 'swipe to turn  ·  tap to cast' : '← ↑ → ↓ / WASD turn   ·   SPACE / ENTER cast', W / 2, yb);
    cx.fillStyle = '#9c8fc8'; cx.font = '500 13px ' + FONT;
    cx.fillText('ringed letters finish a word · cast before the fuse runs out', W / 2, yb + 24);
    cx.globalAlpha = 1;
  }
  if (touchUI && H > 760) {
    const by = H - 96;
    cx.fillStyle = 'rgba(255,211,77,0.12)'; rr(24, by, W - 48, 70, 18); cx.fill();
    cx.strokeStyle = 'rgba(255,211,77,0.4)'; cx.lineWidth = 2; cx.stroke();
    cx.fillStyle = headWord() ? '#ffd34d' : '#a99bd0'; cx.font = '900 22px ' + FONT;
    cx.fillText(headWord() ? 'TAP TO CAST ' + headWord() : 'TAP ANYWHERE TO CAST / SPIT', W / 2, by + 35);
  }
  cx.textBaseline = 'alphabetic';
}

function drawReady() {
  const ry = BY + 50;
  cx.fillStyle = 'rgba(15,8,30,0.72)'; cx.fillRect(BX, ry - 46, BWID, 92);
  cx.textAlign = 'center'; cx.textBaseline = 'middle';
  cx.font = '900 30px ' + FONT; cx.fillStyle = '#7ff0c8'; cx.fillText('YOUR BODY IS THE WORD', W / 2, ry - 24);
  const p = 0.65 + 0.35 * Math.sin(performance.now() / 220);
  cx.globalAlpha = p; cx.font = '700 18px ' + FONT; cx.fillStyle = '#fff';
  cx.fillText(touchUI ? 'swipe or tap to start' : 'press an arrow key to start', W / 2, ry + 18);
  cx.globalAlpha = 1; cx.textBaseline = 'alphabetic';
}

function drawOver() {
  const a = Math.min(1, FX.deathT * 2.5);
  cx.fillStyle = 'rgba(12,6,24,' + (0.74 * a) + ')'; cx.fillRect(0, 0, W, H);
  cx.globalAlpha = a; cx.textAlign = 'center'; cx.textBaseline = 'middle';
  const y0 = BY + 80;
  cx.font = '900 46px ' + FONT; cx.fillStyle = '#ff6b8a'; cx.fillText('SNAKE EYES', W / 2, y0);
  cx.font = '600 18px ' + FONT; cx.fillStyle = '#ffd0dc'; cx.fillText(S.cause || '', W / 2, y0 + 42);
  cx.font = '900 58px ' + FONT; cx.fillStyle = '#fff'; cx.fillText(String(S.score), W / 2, y0 + 116);
  cx.font = '700 18px ' + FONT; cx.fillStyle = FX.newBest ? '#ffd34d' : '#b9a8de';
  cx.fillText(FX.newBest ? '★ NEW BEST ★' : 'best ' + best, W / 2, y0 + 162);
  cx.font = '600 16px ' + FONT; cx.fillStyle = '#b9a8de';
  cx.fillText(S.casts + ' words cast  ·  level ' + S.level + (S.bestWord ? '  ·  best word ' + S.bestWord + ' +' + S.bestPts : ''), W / 2, y0 + 196);
  const ready = performance.now() - overAt > 400;
  cx.globalAlpha = a * (ready ? 0.65 + 0.35 * Math.sin(performance.now() / 220) : 0.25);
  cx.fillStyle = '#fff'; cx.font = '800 20px ' + FONT; cx.fillText(touchUI ? 'tap to slither again' : 'press any key to slither again', W / 2, y0 + 250);
  cx.globalAlpha = 1; cx.textBaseline = 'alphabetic';
}

// ---------- fit canvas ----------
function fit() {
  const aspect = innerHeight / Math.max(1, innerWidth);
  H = touchUI && aspect > 1.55 ? clamp(Math.round(W * aspect), 720, 980) : 720;
  TOP = Math.round((H - 720) * 0.3); BY = 136 + TOP;
  const dpr = window.devicePixelRatio || 1, s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = (W * s) + 'px'; cv.style.height = (H * s) + 'px';
  cv.style.marginTop = Math.max(0, (innerHeight - H * s) / 2) + 'px';
  cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr);
  cx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
}
addEventListener('resize', fit);
try { if (matchMedia('(pointer: coarse)').matches) touchUI = true; } catch (e) {}
fit();

// ---------- input ----------
const DIRNAME = { up: 0, right: 1, down: 2, left: 3 };
function getActions() { return S.over ? ['none'] : ['none', 'up', 'down', 'left', 'right', 'cast']; }
function applyAction(a) {
  if (!S || S.over) return;
  if (a === 'cast') { if (S.started) S.castQ = true; return; }
  const d = DIRNAME[a]; if (d == null) return;
  if (!S.started) { S.started = true; if (d !== 3) S.dir = d; return; }
  const last = S.turnQ.length ? S.turnQ[S.turnQ.length - 1] : S.dir;
  if (d === last || d === (last + 2) % 4) return;     // no instant 180° reversal
  if (S.turnQ.length < 2) { S.turnQ.push(d); if (!QUIET) SFX.turn(); }   // 2-turn buffer
}
function humanRestart() {
  if (S.over && performance.now() - overAt > 400) { reset(Date.now() & 0x7fffffff, true); return true; }
  return false;
}
const KEYMAP = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', Space: 'cast', Enter: 'cast' };
addEventListener('keydown', e => {
  audioInit();
  const a = KEYMAP[e.code];
  if (a) e.preventDefault();
  if (S.over) { if (!e.repeat) humanRestart(); return; }
  if (!a || e.repeat) return;
  FX.hinted = true;
  if (!S.started && a === 'cast') { S.started = true; return; }
  applyAction(a);
});
function toLogical(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; }
let sw = null;
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audioInit();
  if (e.pointerType === 'touch' && !touchUI) { touchUI = true; fit(); }
  if (S.over) { humanRestart(); return; }
  FX.hinted = true;
  const [x, y] = toLogical(e);
  sw = { x, y, x0: x, y0: y, t: performance.now(), moved: false, id: e.pointerId };
});
cv.addEventListener('pointermove', e => {
  if (!sw || e.pointerId !== sw.id) return;
  const [x, y] = toLogical(e), dx = x - sw.x, dy = y - sw.y;
  if (Math.abs(dx) < 22 && Math.abs(dy) < 22) return;
  const a = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
  applyAction(a); sw.moved = true; sw.x = x; sw.y = y;    // re-anchor: one drag can chain several turns
});
addEventListener('pointerup', e => {
  if (sw && e.pointerId === sw.id && !sw.moved && performance.now() - sw.t < 350) {
    if (!S.started) S.started = true; else applyAction('cast');
  }
  sw = null;
});
addEventListener('pointercancel', () => { sw = null; });

// ---------- main loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(100, now - last); last = now;
  if (!manual) { carry += dt; while (carry >= STEP) { step(); carry -= STEP; } }
  if (FX.hinted && S.t > 6000) FX.hintA = Math.max(0, FX.hintA - dt / 3000);
  render();
  requestAnimationFrame(frame);
}

// ---------- bot API ----------
window.__game = {
  reset(seed) { manual = true; reset(seed, true); },
  getState() {
    return {
      t: S.t, score: S.score, over: S.over, cause: S.cause, difficulty: S.level, level: S.level,
      cols: COLS, rows: ROWS, dir: S.dir, head: S.body[0].slice(), body: S.body.map(b => b.slice()),
      lets: S.lets.map(l => l.c).join(''), gold: S.lets.map(l => l.g), word: headWord(),
      tiles: S.tiles.map(t => ({ x: t.x, y: t.y, c: t.c, g: t.g, age: t.age })),
      rocks: S.rocks.slice(), warns: S.warns.map(w => ({ x: w.x, y: w.y, t: w.t })),
      interval: iv(), moveT: S.moveT, turnQ: S.turnQ.slice(), grace: S.grace,
      streak: S.streak, since: S.since, hungerAt: hungerAt(S.level), grow: S.grow, grown: S.grown, casts: S.casts, spits: S.spits, eaten: S.eaten, blasted: S.blasted, bestWord: S.bestWord,
    };
  },
  getActions() { return getActions(); },
  input(a) { if (typeof a === 'string' && getActions().indexOf(a) >= 0) applyAction(a); },
  tick(ms) { carry += ms; while (carry >= STEP) { step(); carry -= STEP; } },
  isOver() { return S.over; },
  score() { return S.score; },
  snapshot() { return structuredClone({ S, carry }); },
  restore(s) { const c = structuredClone(s); S = c.S; carry = c.carry; },
  quiet(b) { QUIET = !!b; },
  render() { render(); },
  // dictionary helpers for bots (pure, read-only)
  isWord(w) { return DICT.has(String(w).toUpperCase()); },
  isPrefix(p) { return prefixSet().has(String(p).toUpperCase()); },
  wordValue(w) { return wordValue(String(w).toUpperCase()); },
};

reset(Date.now() & 0x7fffffff, false);
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
